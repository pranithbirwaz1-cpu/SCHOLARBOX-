/* ---- 17. Interactive Digital Whiteboard / Scratchpad ---- */
function Whiteboard({ push }) {
  const canvasRef = useRef(null);
  const drawing = useRef(false);
  const [color, setColor] = useState("#6366f1");
  const [size, setSize] = useState(3);

  useEffect(() => {
    const ctx = canvasRef.current.getContext("2d");
    ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, canvasRef.current.width, canvasRef.current.height);
  }, []);

  const getPos = (e) => {
    const rect = canvasRef.current.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return { x: (clientX - rect.left) * (canvasRef.current.width / rect.width), y: (clientY - rect.top) * (canvasRef.current.height / rect.height) };
  };
  const start = (e) => { drawing.current = true; const ctx = canvasRef.current.getContext("2d"); const p = getPos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); };
  const move = (e) => {
    if (!drawing.current) return;
    e.preventDefault();
    const ctx = canvasRef.current.getContext("2d");
    const p = getPos(e);
    ctx.lineTo(p.x, p.y); ctx.strokeStyle = color; ctx.lineWidth = size; ctx.lineCap = "round"; ctx.stroke();
  };
  const end = () => { drawing.current = false; };
  const clearBoard = () => { const ctx = canvasRef.current.getContext("2d"); ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, canvasRef.current.width, canvasRef.current.height); };
  const save = () => { const url = canvasRef.current.toDataURL("image/png"); const a = document.createElement("a"); a.href = url; a.download = "scholarbox-scratchpad.png"; a.click(); push("Whiteboard saved as PNG.", "success"); };

  return (
    <div className="rounded-2xl border border-slate-200 dark:border-slate-800 p-4 bg-white dark:bg-slate-900">
      <div className="flex items-center gap-2 mb-3 text-slate-700 dark:text-slate-200 font-medium text-sm"><PenTool className="w-4 h-4" /> Digital Whiteboard / Scratchpad</div>
      <canvas
        ref={canvasRef} width={560} height={280}
        className="w-full rounded-xl border border-slate-200 dark:border-slate-700 touch-none cursor-crosshair"
        onMouseDown={start} onMouseMove={move} onMouseUp={end} onMouseLeave={end}
        onTouchStart={start} onTouchMove={move} onTouchEnd={end}
      />
      <div className="flex items-center gap-2 mt-2">
        <input type="color" value={color} onChange={(e) => setColor(e.target.value)} className="w-8 h-8 rounded-lg border-0" />
        <input type="range" min="1" max="12" value={size} onChange={(e) => setSize(Number(e.target.value))} className="flex-1" />
        <button onClick={clearBoard} className="text-xs px-2.5 py-1.5 rounded-lg bg-slate-100 dark:bg-slate-800 flex items-center gap-1"><Eraser className="w-3.5 h-3.5" /> Clear</button>
        <button onClick={save} className="text-xs px-2.5 py-1.5 rounded-lg text-white flex items-center gap-1" style={{ background: "var(--accent)" }}><Save className="w-3.5 h-3.5" /> Save PNG</button>
      </div>
    </div>
  );
}

function HabitTrackerCard({ tracker, onToggleDay, onRemove }) {
  const todayKey = new Date().toISOString().slice(0, 10);
  const totalDays = tracker.unit === "weeks" ? tracker.totalValue * 7 : tracker.totalValue;
  const loggedCount = Object.keys(tracker.log || {}).length;
  const streak = useMemo(() => {
    let s = 0; const d = new Date();
    while (tracker.log?.[d.toISOString().slice(0, 10)]) { s++; d.setDate(d.getDate() - 1); }
    return s;
  }, [tracker.log]);
  const last14 = useMemo(() => {
    const days = [];
    for (let i = 13; i >= 0; i--) { const d = new Date(); d.setDate(d.getDate() - i); const k = d.toISOString().slice(0, 10); days.push({ k, logged: !!tracker.log?.[k] }); }
    return days;
  }, [tracker.log]);
  const pct = Math.min(100, Math.round((loggedCount / totalDays) * 100));
  const daysLeft = Math.max(0, totalDays - loggedCount);

  return (
    <div className="rounded-xl bg-slate-50 dark:bg-slate-800/60 p-3">
      <div className="flex items-center justify-between mb-1.5">
        <div className="font-medium text-sm text-slate-700 dark:text-slate-200">{tracker.name}</div>

      <div className="flex items-center justify-between text-xs text-slate-400 mb-1.5">
        <span>{loggedCount}/{totalDays} days · {tracker.unit === "weeks" ? `${tracker.totalValue}-week goal` : `${tracker.totalValue}-day goal`}</span>
        <span>{daysLeft} to go</span>
      </div>
      <div className="w-full h-1.5 rounded-full bg-slate-200 dark:bg-slate-700 overflow-hidden mb-2">
        <div className="h-full rounded-full transition-all" style={{ width: `${pct}%`, background: "var(--accent)" }} />
      </div>
      <div className="flex items-center justify-between">
        <div><span className="text-lg font-semibold">{streak}</span><span className="text-xs text-slate-400 ml-1">day streak</span></div>
        <button onClick={() => onToggleDay(todayKey)} className="text-xs px-3 py-1.5 rounded-lg text-white" style={{ background: "var(--accent)" }}>

        ))}
      </div>
    </div>
  );
}

/* ---- 19. Pomodoro Ambient Sound Generator ---- */
function AmbientSounds({ push }) {
  const ctxRef = useRef(null);
  const nodesRef = useRef({});
  const [playing, setPlaying] = useState(null);
  const [volume, setVolume] = useState(0.3);

  const ensureCtx = () => { if (!ctxRef.current) ctxRef.current = new (window.AudioContext || window.webkitAudioContext)(); return ctxRef.current; };
  const makeNoiseBuffer = (ctx) => {
    const buffer = ctx.createBuffer(1, 2 * ctx.sampleRate, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
    return buffer;
  };
  const stop = () => {
    if (nodesRef.current.src) { try { nodesRef.current.src.stop(); } catch {} }
    nodesRef.current = {}; setPlaying(null);
  };
  const play = (kind) => {
    stop();
    const ctx = ensureCtx();
    const src = ctx.createBufferSource();
    src.buffer = makeNoiseBuffer(ctx); src.loop = true;
    const filter = ctx.createBiquadFilter();
    if (kind === "white") filter.type = "allpass";
    if (kind === "rain") { filter.type = "lowpass"; filter.frequency.value = 900; }
    if (kind === "library") { filter.type = "bandpass"; filter.frequency.value = 450; filter.Q.value = 0.6; }
    const gain = ctx.createGain(); gain.gain.value = volume;
    src.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
    src.start();
    nodesRef.current = { src, gain };
    setPlaying(kind);
  };
  useEffect(() => { if (nodesRef.current.gain) nodesRef.current.gain.gain.value = volume; }, [volume]);
  useEffect(() => () => stop(), []);

  const sounds = [{ id: "white", label: "White Noise" }, { id: "rain", label: "Rainfall" }, { id: "library", label: "Library Chatter" }];

  return (
    <div className="rounded-2xl border border-slate-200 dark:border-slate-800 p-4 bg-white dark:bg-slate-900">
      <div className="flex items-center gap-2 mb-3 text-slate-700 dark:text-slate-200 font-medium text-sm"><Volume2 className="w-4 h-4" /> Ambient Focus Sounds</div>
      <div className="grid grid-cols-3 gap-1.5 mb-2">
        {sounds.map((s) => (
          <button key={s.id} onClick={() => (playing === s.id ? stop() : play(s.id))} className={`text-xs py-2 rounded-lg ${playing === s.id ? "text-white" : "bg-slate-100 dark:bg-slate-800"}`} style={playing === s.id ? { background: "var(--accent)" } : {}}>
            {playing === s.id ? "■ " : "▶ "}{s.label}
          </button>
        ))}
      </div>
      <div className="flex items-center gap-2">
        <VolumeX className="w-3.5 h-3.5 text-slate-400" />
        <input type="range" min="0" max="1" step="0.05" value={volume} onChange={(e) => setVolume(Number(e.target.value))} className="flex-1" />
        <Volume2 className="w-3.5 h-3.5 text-slate-400" />
      </div>
      <p className="text-[10px] text-slate-400 mt-1">Synthesized locally via the Web Audio API — no downloads needed.</p>
    </div>
  );
}

/* ---- 21. Secure Local Note Encryption ---- */
function NoteEncryptionManager({ files, patchFile, push }) {
  const notes = files.filter((f) => !f.trashed && f.content != null && (categoryOf(extOf(f.name)) === "Text" || categoryOf(extOf(f.name)) === "Code"));
  const [selectedId, setSelectedId] = useState("");
  const [passphrase, setPassphrase] = useState("");
  const selected = notes.find((n) => n.id === selectedId);

  const encrypt = () => {
    if (!selected || !passphrase) return;
    patchFile(selected.id, { content: encryptText(selected.content, passphrase), encrypted: true });
    push("Note encrypted locally with your passphrase.", "success");
  };
  const decrypt = () => {
    if (!selected || !passphrase) return;
    try { patchFile(selected.id, { content: decryptText(selected.content, passphrase), encrypted: false }); push("Note decrypted.", "success"); }
    catch { push("Decryption failed — check your passphrase.", "error"); }
  };

  return (
    <div className="rounded-2xl border border-slate-200 dark:border-slate-800 p-4 bg-white dark:bg-slate-900">
      <div className="flex items-center gap-2 mb-3 text-slate-700 dark:text-slate-200 font-medium text-sm"><KeyRound className="w-4 h-4" /> Local Note Encryption</div>
      {notes.length === 0 ? (
        <p className="text-xs text-slate-400">Create a text or Markdown note (New Note) to encrypt it here.</p>
      ) : (
        <>
          <select value={selectedId} onChange={(e) => setSelectedId(e.target.value)} className="w-full text-xs rounded-lg border border-slate-200 dark:border-slate-700 bg-transparent px-2 py-1.5 outline-none mb-2">
            <option value="">Select a note…</option>
            {notes.map((n) => <option key={n.id} value={n.id}>{n.name}{n.encrypted ? " 🔒" : ""}</option>)}
          </select>
          <input type="password" value={passphrase} onChange={(e) => setPassphrase(e.target.value)} placeholder="Passphrase" className="w-full text-xs rounded-lg border border-slate-200 dark:border-slate-700 bg-transparent px-2 py-1.5 outline-none mb-2" />
          <div className="flex gap-1.5">
            <button onClick={encrypt} disabled={!selected || !passphrase} className="flex-1 text-xs py-1.5 rounded-lg text-white disabled:opacity-40" style={{ background: "var(--accent)" }}>Encrypt</button>
            <button onClick={decrypt} disabled={!selected || !passphrase} className="flex-1 text-xs py-1.5 rounded-lg bg-slate-100 dark:bg-slate-800 disabled:opacity-40">Decrypt</button>
          </div>
          <p className="text-[10px] text-slate-400 mt-1.5">Reversible local cipher keyed to your passphrase — nothing leaves this device.</p>
        </>
      )}

  );
}

/* ---- Grid-size picker (Word-style drag to choose rows × columns) ---- */
function GridSizePicker({ maxRows = 8, maxCols = 10, onPick }) {
  const [hover, setHover] = useState({ r: 0, c: 0 });
  const [dragging, setDragging] = useState(false);
  const cells = [];
  for (let r = 1; r <= maxRows; r++) {
    for (let c = 1; c <= maxCols; c++) cells.push({ r, c });
  }
  const commit = (r, c) => onPick(r, c);
  return (
    <div className="inline-block select-none">
      <div
        className="grid gap-1 p-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800/60"
        style={{ gridTemplateColumns: `repeat(${maxCols}, 16px)` }}
        onMouseLeave={() => !dragging && setHover({ r: 0, c: 0 })}
        onMouseUp={() => { if (dragging) { setDragging(false); commit(hover.r, hover.c); } }}
      >
        {cells.map(({ r, c }) => {
          const active = r <= hover.r && c <= hover.c;
          return (
            <div
              key={`${r}-${c}`}
              onMouseDown={() => { setDragging(true); setHover({ r, c }); }}
              onMouseEnter={() => setHover({ r, c })}
              onMouseUp={() => { setDragging(false); commit(r, c); }}
              onTouchStart={() => setHover({ r, c })}
              onTouchEnd={() => commit(hover.r || r, hover.c || c)}
              className={`w-4 h-4 rounded-sm border transition-colors cursor-pointer ${
                active ? "border-indigo-400" : "border-slate-300 dark:border-slate-600"
              }`}
              style={active ? { background: "var(--accent)" } : {}}
              title={`${r} × ${c}`}
            />
          );
        })}
      </div>
      <div className="text-center text-xs text-slate-500 dark:text-slate-400 mt-1.5 font-medium">
        {hover.r > 0 ? `${hover.r} rows × ${hover.c} columns` : "Drag or tap to choose a size"}
      </div>
    </div>
  );
}

/* ---- Custom Table / Room Layout Builder — click-to-edit cells ---- */
function CustomTableBuilder({ push }) {
  const [tables, setTables] = useState(() => loadLS(LS_KEYS.customTables, []));
  useEffect(() => saveLS(LS_KEYS.customTables, tables), [tables]);
  const [activeId, setActiveId] = useState(null);
  const [showPicker, setShowPicker] = useState(false);
  const [editingCell, setEditingCell] = useState(null); // {r,c}
  const [draft, setDraft] = useState("");

  const active = tables.find((t) => t.id === activeId);

  const createTable = (rows, cols) => {
    if (!rows || !cols) return;
    const grid = Array.from({ length: rows }, () => Array.from({ length: cols }, () => ""));
    const t = { id: uid(), name: `Table ${tables.length + 1}`, rows, cols, grid, createdAt: Date.now() };
    setTables((ts) => [...ts, t]);
    setActiveId(t.id);
    setShowPicker(false);
    push(`Created a ${rows} × ${cols} table — click any cell to edit it.`, "success");
  };

  const renameTable = (name) => setTables((ts) => ts.map((t) => (t.id === activeId ? { ...t, name } : t)));
  const deleteTable = (id) => { setTables((ts) => ts.filter((t) => t.id !== id)); if (activeId === id) setActiveId(null); };

  const openCell = (r, c) => { setDraft(active.grid[r][c]); setEditingCell({ r, c }); };
  const saveCell = () => {
    if (!editingCell || !active) return;
    const { r, c } = editingCell;
    setTables((ts) => ts.map((t) => {
      if (t.id !== active.id) return t;
      const grid = t.grid.map((row) => row.slice());
      grid[r][c] = draft;
      return { ...t, grid };
    }));
    setEditingCell(null);
  };

  const addRow = () => setTables((ts) => ts.map((t) => (t.id === activeId ? { ...t, rows: t.rows + 1, grid: [...t.grid, Array.from({ length: t.cols }, () => "")] } : t)));
  const addCol = () => setTables((ts) => ts.map((t) => (t.id === activeId ? { ...t, cols: t.cols + 1, grid: t.grid.map((row) => [...row, ""]) } : t)));
  const removeRow = (idx) => setTables((ts) => ts.map((t) => (t.id === activeId ? { ...t, rows: t.rows - 1, grid: t.grid.filter((_, i) => i !== idx) } : t)));
  const removeCol = (idx) => setTables((ts) => ts.map((t) => (t.id === activeId ? { ...t, cols: t.cols - 1, grid: t.grid.map((row) => row.filter((_, i) => i !== idx)) } : t)));

  const exportCsv = () => {
    if (!active) return;
    const csv = active.grid.map((row) => row.map((cell) => `"${String(cell).replace(/"/g, '""')}"`).join(",")).join("\n");
    downloadBlob(csv, `${active.name.replace(/\s+/g, "_")}.csv`, "text/csv");
    push("Table exported as CSV.", "success");
  };

  return (
    <div className="rounded-2xl border border-slate-200 dark:border-slate-800 p-4 bg-white dark:bg-slate-900">
      <div className="flex items-center justify-between mb-3">

          </div>
          <div className="overflow-auto max-h-[420px] rounded-xl border border-slate-200 dark:border-slate-800">
            <table className="border-collapse w-full text-xs">
              <tbody>

                    <td className="p-0 w-6">
                      <button onClick={() => removeRow(r)} disabled={active.rows <= 1} className="w-full h-full px-1 text-slate-300 hover:text-rose-500 disabled:opacity-30 opacity-0 group-hover/row:opacity-100 transition" title="Remove this row"><X className="w-3 h-3" /></button>
                    </td>

                ))}
                <tr>
                  {active.grid[0]?.map((_, c) => (
                    <td key={c} className="p-0 text-center">
                      <button onClick={() => removeCol(c)} disabled={active.cols <= 1} className="w-full text-[9px] text-slate-300 hover:text-rose-500 disabled:opacity-30 py-0.5" title="Remove this column">✕ col</button>
                    </td>

                  <td />

              </tbody>

      )}

      {tables.length === 0 && !showPicker && (
        <div className="text-center py-8 text-slate-400 text-sm">No tables yet — click "New table" and drag to pick a size.</div>
      )}
    </div>
  );
}

/* =============================== Main App ================================== */
function ScholarBox1GB() {
  const [showFbConnect, setShowFbConnect] = useState(false);
  const [authUser, setAuthUser] = useState(null);
  const [authChecked, setAuthChecked] = useState(!LIVE);
  const [authError, setAuthError] = useState("");
  useEffect(() => {
    if (!LIVE) return;
    let settled = false;
    const unsub = auth.onAuthStateChanged(
      (user) => { settled = true; setAuthError(""); setAuthUser(user); setAuthChecked(true); },
      (err) => {
        settled = true;
        console.error("Firebase auth error:", err);
        setAuthError(friendlyAuthError(err) || "Could not reach Firebase Auth.");
        setAuthChecked(true);
      }
    );
    // Safety valve: never let the UI hang on "Connecting…" forever. If
    // Firebase hasn't responded within 8s (bad API key, unauthorized
    // domain, blocked network request, etc.) show a retry screen instead.
    const timer = setTimeout(() => {
      if (!settled) {
        setAuthError("Taking too long to connect to Firebase. Check your internet connection, or that this domain is in your Firebase project's Authorized Domains list.");
        setAuthChecked(true);
      }
    }, 8000);
    return () => { unsub(); clearTimeout(timer); };
  }, []);
  const retryConnection = () => {
    setAuthChecked(false);
    setAuthError("");
    window.location.reload();
  };
  const [unlockTime, setUnlockTime] = useState(() => Number(loadLS(LS_KEYS.unlockTime, Date.now())));
  useEffect(() => {
    if (authUser) {
      const t = Date.now();
      saveLS(LS_KEYS.unlockTime, t);
      setUnlockTime(t);
    }
  }, [authUser]);
  const { toasts, push, dismiss } = useToasts();
  const [lastUploadError, setLastUploadError] = useState(null);

  const [theme, setTheme] = useState(() => loadLS(LS_KEYS.theme, "light"));
  useEffect(() => saveLS(LS_KEYS.theme, theme), [theme]);

  const [files, setFiles] = useState(() => (LIVE ? [] : loadLS(LS_KEYS.files, [])));
  const [folders, setFolders] = useState(() => (LIVE ? [] : loadLS(LS_KEYS.folders, [])));
  const [activity, setActivity] = useState(() => (LIVE ? [] : loadLS(LS_KEYS.activity, [])));
  const [tasks, setTasks] = useState(() => (LIVE ? [] : loadLS(LS_KEYS.tasks, [])));
  const [displayName] = useState(() => {
    const existing = loadLS(LS_KEYS.displayName, null);
    if (existing) return existing;
    const name = `Student-${Math.floor(1000 + Math.random() * 9000)}`;
    saveLS(LS_KEYS.displayName, name);
    return name;
  });

  const [currentFolder, setCurrentFolder] = useState(null);
  const [view, setView] = useState(() => loadLS(LS_KEYS.view, "grid"));
  const [sortBy, setSortBy] = useState("date");
  const [searchTerm, setSearchTerm] = useState("");
  const [showStarredOnly, setShowStarredOnly] = useState(false);
  const [showTrash, setShowTrash] = useState(false);
  const [selected, setSelected] = useState(new Set());
  const [activeTab, setActiveTab] = useState("files"); // files | tools | activity | peers
  const [toolsCategory, setToolsCategory] = useState("calc");
  const [dragOver, setDragOver] = useState(false);
  const [online, setOnline] = useState(navigator.onLine);

  const [previewFile, setPreviewFile] = useState(null);
  const [editorFile, setEditorFile] = useState(null);
  const [shareFile, setShareFile] = useState(null);
  const [showHelp, setShowHelp] = useState(false);
  const [showNewFolder, setShowNewFolder] = useState(false);
  const [newFolderName, setNewFolderName] = useState("");
  const [showMdCreator, setShowMdCreator] = useState(false);
  const [showCalcOverlay, setShowCalcOverlay] = useState(false);
  const [showProfile, setShowProfile] = useState(false);
  const [profile, setProfile] = useState(() => loadLS(LS_KEYS.profile, { name: "", photo: "", college: "", bio: "" }));
  useEffect(() => saveLS(LS_KEYS.profile, profile), [profile]);
  useEffect(() => {
    if (LIVE && authUser && !profile.name) {
      setProfile((p) => ({ ...p, name: (authUser.email || "").split("@")[0] }));
    }
  }, [authUser]);

  const searchRef = useRef(null);
  const fileInputRef = useRef(null);

  useEffect(() => { document.documentElement.classList.toggle("dark", theme === "dark"); }, [theme]);
  useEffect(() => { document.documentElement.style.setProperty("--accent", loadLS(LS_KEYS.accent, "#6366f1")); }, []);
  useEffect(() => saveLS(LS_KEYS.view, view), [view]);
  useEffect(() => { if (!LIVE) saveLS(LS_KEYS.tasks, tasks); }, [tasks]);
  // Mirror tasks to Firestore in live mode, so assignments/to-dos sync
  // across every device connected to the same Firebase project — just
  // like files already do. Stored as one small document rather than a
  // collection-per-task, since task lists are short and this keeps writes
  // cheap. The `lastWrittenTasks` guard stops our own writes from bouncing
  // straight back through the listener below and causing a render loop.
  const lastWrittenTasks = useRef(null);
  useEffect(() => {
    if (!LIVE) return;
    const json = JSON.stringify(tasks);
    if (json === lastWrittenTasks.current) return;
    lastWrittenTasks.current = json;
    db.collection("app").doc("tasks").set({ tasks, updatedAt: Date.now() }).catch((e) => console.error("Task sync failed:", e));
  }, [tasks]);
  useEffect(() => { if (!LIVE) saveLS(LS_KEYS.files, files); }, [files]);
  useEffect(() => { if (!LIVE) saveLS(LS_KEYS.folders, folders); }, [folders]);
  useEffect(() => { if (!LIVE) saveLS(LS_KEYS.activity, activity); }, [activity]);

  /* ---- Re-mint blob: URLs from IndexedDB on load ----
     blob: URLs die on every page refresh, so any file that has real bytes
     stashed in IndexedDB needs a brand new URL each time the app boots.
     This is what makes "Open Directly", downloads, and previews keep working
     after you close and reopen the file. */
  useEffect(() => {
    if (LIVE) return;
    let cancelled = false;
    (async () => {
      const updates = {};
      for (const f of files) {
        if (f.hasBlob) {
          try {
            const blob = await idbGetBlob(f.id);
            if (blob) updates[f.id] = URL.createObjectURL(blob);
          } catch {}
        }
      }
      if (!cancelled && Object.keys(updates).length) {
        setFiles((prev) => prev.map((f) => (updates[f.id] ? { ...f, downloadURL: updates[f.id] } : f)));
      }
    })();
    return () => { cancelled = true; };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  /* ---- Offline detector (Feature 39) ---- */
  useEffect(() => {
    const on = () => { setOnline(true); push("Back online — sync resumed.", "success"); };
    const off = () => { setOnline(false); push("You're offline — changes are saved locally.", "error"); };
    window.addEventListener("online", on);
    window.addEventListener("offline", off);
    return () => { window.removeEventListener("online", on); window.removeEventListener("offline", off); };
  }, [push]);

  /* ---- Keyboard shortcuts (Feature 38) ---- */
  useEffect(() => {
    const onKey = (e) => {
      const mod = e.ctrlKey || e.metaKey;
      if (mod && e.key.toLowerCase() === "k") { e.preventDefault(); searchRef.current?.focus(); }
      if (mod && e.key.toLowerCase() === "u") { e.preventDefault(); fileInputRef.current?.click(); }
      if (mod && e.key.toLowerCase() === "g") { e.preventDefault(); setView((v) => (v === "grid" ? "list" : "grid")); }
      if (mod && e.key.toLowerCase() === "n") { e.preventDefault(); setShowNewFolder(true); }
      if (mod && e.key.toLowerCase() === "t") { e.preventDefault(); setActiveTab("tools"); }
      if (mod && e.key.toLowerCase() === "d") { e.preventDefault(); setTheme((t) => (t === "dark" ? "light" : "dark")); }
      if (!mod && e.key === "?") { e.preventDefault(); setShowHelp(true); }
      if (e.key === "Escape") { setPreviewFile(null); setEditorFile(null); setShareFile(null); setShowHelp(false); setShowNewFolder(false); setShowMdCreator(false); setShowCalcOverlay(false); setShowProfile(false); }
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, []);

  /* ---- Firestore live sync (real Firebase mode) ---- */
  useEffect(() => {
    if (!LIVE) return;
    const unsubFiles = db.collection("files").orderBy("uploadedAt", "desc").onSnapshot((snap) => {
      setFiles(snap.docs.map((d) => ({ id: d.id, ...d.data() })));
    });
    const unsubFolders = db.collection("folders").onSnapshot((snap) => {
      setFolders(snap.docs.map((d) => ({ id: d.id, ...d.data() })));
    });
    const unsubActivity = db.collection("activityLog").orderBy("at", "desc").onSnapshot((snap) => {
      setActivity(snap.docs.map((d) => ({ id: d.id, ...d.data() })));
    });
    const unsubTasks = db.collection("app").doc("tasks").onSnapshot((doc) => {
      const incoming = (doc.exists && doc.data().tasks) || [];
      lastWrittenTasks.current = JSON.stringify(incoming);
      setTasks(incoming);
    });
    const presenceRef = db.collection("presence").doc(displayName);
    presenceRef.set({ name: displayName, lastSeen: firebase.firestore.FieldValue.serverTimestamp(), folder: currentFolder || "root" }, { merge: true });
    const heartbeat = setInterval(() => presenceRef.set({ lastSeen: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true }), 15000);
    return () => { unsubFiles(); unsubFolders(); unsubActivity(); unsubTasks(); clearInterval(heartbeat); };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  const [peers, setPeers] = useState([{ name: displayName, self: true }]);
  useEffect(() => {
    if (!LIVE) { setPeers([{ name: displayName, self: true }]); return; }
    const unsub = db.collection("presence").onSnapshot((snap) => {
      setPeers(snap.docs.map((d) => ({ name: d.id, self: d.id === displayName })));
    });
    return unsub;
  }, [displayName]);

  /* ---- Auth handlers ---- */
  const handleLock = () => {
    if (LIVE) {
      auth.signOut().catch(() => {});
    }
  };
  const handleWipe = () => {
    // Tasks now sync live to Firestore (see the sync effect above), so on
    // this device wiping must NOT call setTasks([]) when LIVE — that would
    // push an empty list straight to the shared cloud document and wipe
    // everyone's tasks, not just this device's local cache.
    const msg = LIVE
      ? "This clears local caches (theme, view prefs) on this device. Cloud files and tasks are not affected. Continue?"
      : "This clears local caches (theme, view prefs, tasks) on this device. Cloud files are not affected. Continue?";
    if (!window.confirm(msg)) return;
    Object.values(LS_KEYS).forEach((k) => { if (k !== LS_KEYS.session) localStorage.removeItem(k); });
    if (!LIVE) setTasks([]);
    push("Local caches wiped.", "success");
  };

  /* ---- Activity log helper ---- */
  const logActivity = useCallback(async (message) => {
    const entry = { id: uid(), message, by: displayName, at: Date.now() };
    if (LIVE) {
      try { await db.collection("activityLog").add({ message, by: displayName, at: Date.now() }); }
      catch (e) { console.error(e); }
    } else {
      setActivity((a) => [entry, ...a].slice(0, 200));
    }
  }, [displayName]);

  /* ---- Derived data ---- */
  const activeFiles = useMemo(() => files.filter((f) => !f.trashed), [files]);
  const usedBytes = useMemo(() => activeFiles.reduce((sum, f) => sum + (f.size || 0), 0), [activeFiles]);
  const usedMB = usedBytes / (1024 * 1024);
  const remainingBytes = Math.max(0, GB_LIMIT_BYTES - usedBytes);

  const folderChain = useMemo(() => {
    const chain = [];
    let cur = currentFolder;
    while (cur) {
      const f = folders.find((x) => x.id === cur);
      if (!f) break;
      chain.unshift(f);
      cur = f.parentId;
    }
    return chain;
  }, [currentFolder, folders]);

  const visibleFolders = folders.filter((f) => (f.parentId || null) === currentFolder);

  const visibleFiles = useMemo(() => {
    let list = files.filter((f) => (showTrash ? f.trashed : !f.trashed && (f.folderId || null) === currentFolder));
    if (showStarredOnly) list = list.filter((f) => f.starred);
    if (searchTerm.trim()) {
      const q = searchTerm.toLowerCase();
      list = list.filter((f) => f.name.toLowerCase().includes(q) || extOf(f.name).includes(q) || (f.tags || []).some((t) => t.toLowerCase().includes(q)));
    }
    const sorters = {
      name: (a, b) => a.name.localeCompare(b.name),
      size: (a, b) => b.size - a.size,
      date: (a, b) => (b.uploadedAt || 0) - (a.uploadedAt || 0),
      type: (a, b) => extOf(a.name).localeCompare(extOf(b.name)),
    };
    return [...list].sort(sorters[sortBy]);
  }, [files, showTrash, currentFolder, showStarredOnly, searchTerm, sortBy]);

  const largestFiles = useMemo(() => [...activeFiles].sort((a, b) => b.size - a.size).slice(0, 5), [activeFiles]);
  const recentFiles = useMemo(() => [...activeFiles].sort((a, b) => (b.uploadedAt || 0) - (a.uploadedAt || 0)).slice(0, 6), [activeFiles]);

  /* ---- File mutation helpers (local/Firestore agnostic) ---- */
  const persistNewFile = async (meta, explicitId) => {
    if (LIVE) {
      const docRef = await db.collection("files").add(meta);
      return docRef.id;
    }
    const id = explicitId || uid();
    setFiles((f) => [{ id, ...meta }, ...f]);
    return id;
  };
  const patchFile = async (id, patch) => {
    if (LIVE) { await db.collection("files").doc(id).update(patch); }
    else { setFiles((f) => f.map((x) => (x.id === id ? { ...x, ...patch } : x))); }
  };
  const removeFileDoc = async (id) => {
    if (LIVE) { await db.collection("files").doc(id).delete(); }
    else { setFiles((f) => f.filter((x) => x.id !== id)); }
  };

  /* ---- Upload pipeline ---- */
  const handleFiles = async (fileList) => {
    const incoming = Array.from(fileList);
    let runningTotal = usedBytes;
    let failCount = 0;
    let okCount = 0;
    setLastUploadError(null);
    for (const file of incoming) {
      if (runningTotal + file.size > GB_LIMIT_BYTES) {
        window.alert(`Upload blocked: "${file.name}" (${formatBytes(file.size)}) would exceed your 1 GB quota. Free up space and try again.`);
        continue;
      }
      const ext = extOf(file.name);
      const id = uid();
      try {
        const buffer = await file.arrayBuffer();
        const hash = await sha256Hex(buffer);
        let downloadURL = null;
        let content = null;
        let storagePath = null;

        if (LIVE) {
          storagePath = `files/${id}_${file.name}`;
          const objRef = storage.ref(storagePath);
          await new Promise((resolve, reject) => {
            const task = objRef.put(file);
            task.on("state_changed", null, reject, async () => {
              try {
                downloadURL = await objRef.getDownloadURL();
                resolve();
              } catch (e) { reject(e); }
            });
          });
        } else {
          if (["txt", "md", "js", "jsx", "ts", "py", "json", "css", "html", "csv", "tsv"].includes(ext) && file.size < 2_000_000) {
            content = await file.text();
          }
          // Store the actual bytes in IndexedDB (survives reloads) and mint a
          // blob: URL for immediate use in this session. The URL alone was
          // being saved to localStorage before, which is why links died on refresh.
          try { await idbPutBlob(id, file); } catch (e) { console.warn("IndexedDB store failed, file will only work this session:", e); }
          downloadURL = URL.createObjectURL(file);
        }

        const meta = {
          name: file.name,
          size: file.size,
          folderId: currentFolder,
          tags: [],
          starred: false,
          trashed: false,
          description: "",
          version: 1,
          hash,
          content,
          downloadURL,
          storagePath,
          hasBlob: !LIVE,
          uploadedAt: Date.now(),
          shareToken: null,
          shareExpiresAt: null,
        };
        await persistNewFile(meta, id);
        runningTotal += file.size;
        okCount += 1;
        logActivity(`uploaded "${file.name}" (${formatBytes(file.size)})`);
      } catch (e) {
        // Surface the real reason instead of failing silently — this is the
        // #1 cause of "upload does nothing": Firebase Storage/Firestore
        // security rules blocking the write for this signed-in user.
        failCount += 1;
        console.error(`Upload failed for "${file.name}":`, e);
        const code = (e && e.code) || "";
        let reason = (e && e.message) || "Unknown error.";
        if (code.includes("storage/unauthorized") || code.includes("permission-denied")) {
          reason = "Permission denied by Firebase Security Rules. In Firebase Console, open Storage → Rules (and Firestore → Rules) and allow read/write for signed-in users.";
        } else if (code.includes("storage/unauthenticated")) {
          reason = "Not signed in to Firebase — try logging out and back in.";
        } else if (code.includes("storage/unknown") || code.includes("storage/object-not-found")) {
          reason = "Firebase Storage bucket not found or not set up for this project — check the Storage tab in Firebase Console.";
        } else if (code.includes("storage/quota-exceeded")) {
          reason = "Firebase Storage quota exceeded for this project.";
        } else if (code.includes("network")) {
          reason = "Network error while uploading — check your connection and try again.";
        }
        push(`Couldn't upload "${file.name}": ${reason}`, "error");
        setLastUploadError(`"${file.name}" — ${reason}`);
      }
    }
    if (okCount) push(`Upload complete — ${okCount} file(s) saved${LIVE ? " to your Firebase project" : ""}.`, "success");
    if (failCount && !okCount) push(`${failCount} file(s) failed to upload — see the message above for why.`, "error");
  };

  const onDrop = (e) => {
    e.preventDefault();
    setDragOver(false);
    if (e.dataTransfer.files?.length) handleFiles(e.dataTransfer.files);
  };

  /* ---- File actions ---- */
  const toggleStar = (f) => { patchFile(f.id, { starred: !f.starred }); };
  const trashFile = (f) => { patchFile(f.id, { trashed: true }); logActivity(`moved "${f.name}" to trash`); };
  const restoreFile = (f) => { patchFile(f.id, { trashed: false }); logActivity(`restored "${f.name}" from trash`); };
  const permanentDelete = async (f) => {
    if (!window.confirm(`Permanently delete "${f.name}"? This cannot be undone.`)) return;
    if (LIVE && f.storagePath) { try { await storage.ref(f.storagePath).delete(); } catch {} }
    if (!LIVE && f.hasBlob) { await idbDeleteBlob(f.id); }
    await removeFileDoc(f.id);
    logActivity(`permanently deleted "${f.name}"`);
  };
  const bumpVersion = (f) => { patchFile(f.id, { version: (f.version || 1) + 1 }); push(`Bumped to v${(f.version || 1) + 1}`, "success"); };
  const setDescription = (f, description) => patchFile(f.id, { description });
  const toggleTag = (f, tag) => {
    const tags = f.tags || [];
    patchFile(f.id, { tags: tags.includes(tag) ? tags.filter((t) => t !== tag) : [...tags, tag] });
  };

  const generateShareLink = (f) => {
    const token = uid().slice(0, 12);
    const link = `https://scholarbox.app/s/${token}`;
    patchFile(f.id, { shareToken: token });
    return link;
  };
  const setLinkExpiry = (f, hours) => {
    const expiresAt = Date.now() + hours * 3600 * 1000;
    patchFile(f.id, { shareExpiresAt: expiresAt });
  };

  const copyToClipboard = async (text, label = "Copied to clipboard") => {
    const ok = await robustCopyText(text);
    if (ok) push(label, "success");
    else push("Copy failed — select and copy manually.", "error");
  };

  const createFolder = async () => {
    if (!newFolderName.trim()) return;
    const name = newFolderName.trim();
    const meta = { name, parentId: currentFolder };
    setNewFolderName("");
    setShowNewFolder(false);
    if (LIVE) {
      try {
        await db.collection("folders").add(meta);
        logActivity(`created folder "${name}"`);
      } catch (e) {
        console.error("Folder create failed:", e);
        push(`Couldn't create folder: ${(e && e.message) || "check Firestore Rules"}`, "error");
        return;
      }
    } else {
      setFolders((f) => [...f, { id: uid(), ...meta }]);
      logActivity(`created folder "${name}"`);
    }
  };

  const createMarkdownNote = async (title, body) => {
    const id = uid();
    const blob = new Blob([body], { type: "text/markdown" });
    let downloadURL = null;
    let hasBlob = false;
    if (!LIVE) {
      try { await idbPutBlob(id, blob); hasBlob = true; downloadURL = URL.createObjectURL(blob); } catch {}
    }
    const meta = {
      name: `${title || "Untitled Note"}.md`,
      size: blob.size,
      folderId: currentFolder,
      tags: [],
      starred: false,
      trashed: false,
      description: "Markdown study note",
      version: 1,
      hash: "",
      content: body,
      downloadURL,
      hasBlob,
      uploadedAt: Date.now(),
    };
    // Wait for the write to actually land before telling the user it's
    // saved — previously this fired the success toast unconditionally,
    // so a silently-failed Firestore write (e.g. blocked by Security
    // Rules) still looked like it worked, and the note vanished on the
    // next refresh because it was never really there.
    try {
      await persistNewFile(meta, id);
      logActivity(`created note "${meta.name}"`);
      push("Note saved.", "success");
    } catch (e) {
      console.error("Note save failed:", e);
      const code = (e && e.code) || "";
      let reason = (e && e.message) || "Unknown error.";
      if (code.includes("permission-denied")) {
        reason = "Permission denied by Firestore Security Rules. Check Firestore \u2192 Rules in Firebase Console.";
      }
      push(`Couldn't save note: ${reason}`, "error");
    }
  };

  const toggleSelect = (id) => {
    setSelected((s) => {
      const next = new Set(s);

  const bulkDelete = () => {
    if (selected.size === 0) return;

  const bulkDownload = () => {
    const targets = files.filter((f) => selected.has(f.id));
    push(`Preparing zip bundle of ${targets.length} file(s)…`);
    setTimeout(() => {
      targets.forEach((f) => { if (f.downloadURL) { const a = document.createElement("a"); a.href = f.downloadURL; a.download = f.name; a.click(); } });

function CsvTablePreview({ content }) {
  const rows = useMemo(() => {
    if (!content) return [];
    return content.trim().split(/\r?\n/).map((line) => {
      const cells = [];
      let cur = "", inQuotes = false;
      for (let i = 0; i < line.length; i++) {
        const ch = line[i];
        if (ch === '"') { inQuotes = !inQuotes; continue; }
        if (ch === "," && !inQuotes) { cells.push(cur); cur = ""; continue; }
        cur += ch;
      }
      cells.push(cur);
      return cells;
    });
  }, [content]);
  if (!rows.length) return <p className="text-sm text-slate-400 py-8 text-center">No data to preview.</p>;
  const [header, ...body] = rows;
  return (
    <div className="max-h-[55vh] overflow-auto rounded-xl border border-slate-200 dark:border-slate-800">
      <table className="text-xs w-full border-collapse">
        <thead className="sticky top-0 bg-slate-100 dark:bg-slate-800">
          <tr>{header.map((h, i) => <th key={i} className="px-2 py-1.5 text-left font-medium border-b border-slate-200 dark:border-slate-700 whitespace-nowrap">{h}</th>)}</tr>
        </thead>
        <tbody>
          {body.map((r, ri) => (
            <tr key={ri} className={ri % 2 ? "bg-slate-50 dark:bg-slate-800/40" : ""}>
              {r.map((c, ci) => <td key={ci} className="px-2 py-1 border-b border-slate-100 dark:border-slate-800 whitespace-nowrap">{c}</td>)}
            </tr>
          ))}
        </tbody>
      </table>
    </div>
  );
}

function DocxPreview({ url }) {
  const [html, setHtml] = useState(null);
  const [error, setError] = useState(false);
  useEffect(() => {
    let cancelled = false;
    setHtml(null); setError(false);
    (async () => {
      try {
        if (!window.mammoth) { setError(true); return; }
        const res = await fetch(url);
        const buf = await res.arrayBuffer();
        const result = await window.mammoth.convertToHtml({ arrayBuffer: buf });
        if (!cancelled) setHtml(result.value);
      } catch { if (!cancelled) setError(true); }
    })();
    return () => { cancelled = true; };
  }, [url]);
  if (error) return <p className="text-sm text-slate-400 py-8 text-center">Couldn't render this document inline — try "Open Directly" below.</p>;
  if (!html) return <p className="text-sm text-slate-400 py-8 text-center">Loading document preview…</p>;
  return (
    <div
      className="max-h-[55vh] overflow-auto rounded-xl border border-slate-200 dark:border-slate-800 p-4 text-sm leading-relaxed [&_h1]:text-lg [&_h1]:font-semibold [&_h2]:text-base [&_h2]:font-semibold [&_p]:mb-2 [&_ul]:list-disc [&_ul]:pl-5 [&_ol]:list-decimal [&_ol]:pl-5"
      dangerouslySetInnerHTML={{ __html: html }}
    />
  );
}

function SheetPreview({ url }) {
  const [html, setHtml] = useState(null);
  const [error, setError] = useState(false);
  useEffect(() => {
    let cancelled = false;
    setHtml(null); setError(false);
    (async () => {
      try {
        if (!window.XLSX) { setError(true); return; }
        const res = await fetch(url);
        const buf = await res.arrayBuffer();
        const wb = window.XLSX.read(buf, { type: "array" });
        const firstSheet = wb.Sheets[wb.SheetNames[0]];
        const htmlStr = window.XLSX.utils.sheet_to_html(firstSheet, { header: "", footer: "" });
        if (!cancelled) setHtml(htmlStr);
      } catch { if (!cancelled) setError(true); }
    })();
    return () => { cancelled = true; };
  }, [url]);
  if (error) return <p className="text-sm text-slate-400 py-8 text-center">Couldn't render this spreadsheet inline — try "Open Directly" below.</p>;
  if (!html) return <p className="text-sm text-slate-400 py-8 text-center">Loading spreadsheet preview…</p>;
  return (
    <div
      className="max-h-[55vh] overflow-auto rounded-xl border border-slate-200 dark:border-slate-800 p-2 text-xs [&_table]:border-collapse [&_td]:border [&_td]:border-slate-200 [&_td]:px-2 [&_td]:py-1 dark:[&_td]:border-slate-700"
      dangerouslySetInnerHTML={{ __html: html }}
    />
  );
}

function shuffleArr(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function recordBest(gameId, value, higherIsBetter = true) {
  const all = loadLS(LS_KEYS.gameScores, {});
  const prev = all[gameId];
  const best = prev == null ? value : (higherIsBetter ? Math.max(prev, value) : Math.min(prev, value));
  saveLS(LS_KEYS.gameScores, { ...all, [gameId]: best });
  return best;
}
function getBest(gameId, fallback = 0) { return loadLS(LS_KEYS.gameScores, {})[gameId] ?? fallback; }

/* ---- Math 1: Sudoku (freshly generated every round, 3 difficulty tiers) ---- */
const SUDOKU_DIFFICULTIES = {
  easy: { label: "Easy", clues: 40 },
  medium: { label: "Medium", clues: 32 },
  hard: { label: "Hard", clues: 26 },
};
function generateSudoku(difficulty = "medium") {
  const base = (r, c) => (r * 3 + Math.floor(r / 3) + c) % 9;
  const nums = shuffleArr([1, 2, 3, 4, 5, 6, 7, 8, 9]);
  const shuffleBands = () => {
    const bands = shuffleArr([[0, 1, 2], [3, 4, 5], [6, 7, 8]]).map((band) => shuffleArr(band));
    return bands.flat();
  };
  const rowsOrder = shuffleBands();
  const colsOrder = shuffleBands();
  const solution = [];
  for (let r = 0; r < 9; r++) for (let c = 0; c < 9; c++) solution.push(nums[base(rowsOrder[r], colsOrder[c])]);
  const puzzle = solution.slice();
  const clues = SUDOKU_DIFFICULTIES[difficulty]?.clues ?? 32;
  const removeCount = 81 - clues;
  const idxs = shuffleArr(Array.from({ length: 81 }, (_, i) => i));
  idxs.slice(0, removeCount).forEach((i) => { puzzle[i] = 0; });
  return { puzzle, solution, difficulty };
}
function sudokuConflicts(grid) {
  const bad = new Set();
  const scan = (idxs) => {
    const seen = {};
    idxs.forEach((i) => {
      const v = grid[i];
      if (!v) return;
      (seen[v] ??= []).push(i);
    });
    Object.values(seen).forEach((arr) => { if (arr.length > 1) arr.forEach((i) => bad.add(i)); });
  };
  for (let r = 0; r < 9; r++) scan(Array.from({ length: 9 }, (_, c) => r * 9 + c));
  for (let c = 0; c < 9; c++) scan(Array.from({ length: 9 }, (_, r) => r * 9 + c));
  for (let br = 0; br < 3; br++) for (let bc = 0; bc < 3; bc++) {
    const idxs = [];
    for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) idxs.push((br * 3 + r) * 9 + (bc * 3 + c));
    scan(idxs);
  }
  return bad;
}
function SudokuGame({ push }) {
  const [difficulty, setDifficulty] = useState("medium");
  const [game, setGame] = useState(() => generateSudoku("medium"));
  const [grid, setGrid] = useState(() => game.puzzle.slice());
  const [result, setResult] = useState(null);
  const [selected, setSelected] = useState(null);
  const [mistakes, setMistakes] = useState(0);
  const [seconds, setSeconds] = useState(0);
  const [running, setRunning] = useState(true);

  useEffect(() => {
    if (!running || result === "correct") return;
    const t = setInterval(() => setSeconds((s) => s + 1), 1000);
    return () => clearInterval(t);
  }, [running, result]);

  const newPuzzle = (diff = difficulty) => {
    const g = generateSudoku(diff);
    setGame(g); setGrid(g.puzzle.slice()); setResult(null); setSelected(null);
    setMistakes(0); setSeconds(0); setRunning(true);
  };
  const changeDifficulty = (diff) => { setDifficulty(diff); newPuzzle(diff); };

  const conflicts = useMemo(() => sudokuConflicts(grid), [grid]);

  const setCell = (i, val) => {
    if (game.puzzle[i] !== 0 || result === "correct") return;
    const v = val.replace(/[^1-9]/g, "").slice(-1);
    const num = v ? Number(v) : 0;
    const next = grid.slice(); next[i] = num;
    setGrid(next); setResult(null);
    if (num && num !== game.solution[i]) setMistakes((m) => m + 1);
    if (next.every((c) => c !== 0) && next.every((c, idx) => c === game.solution[idx])) {
      setResult("correct"); setRunning(false); push?.("Solved it — nice work! 🎉", "success");
    }
  };
  const check = () => {
    if (grid.includes(0)) { push?.("Fill every cell before checking.", "error"); return; }
    const ok = grid.every((v, i) => v === game.solution[i]);
    setResult(ok ? "correct" : "wrong");
    if (ok) setRunning(false);
    push?.(ok ? "Solved it — nice work!" : "Not quite — some cells are off.", ok ? "success" : "error");
  };
  const reveal = () => { setGrid(game.solution.slice()); setResult("correct"); setRunning(false); };
  const fmtTime = (s) => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
  const selVal = selected != null ? grid[selected] : null;

  return (
    <div className="rounded-2xl border border-slate-200 dark:border-slate-800 p-4">
      <div className="flex items-center justify-between mb-2 flex-wrap gap-1.5">
        <div className="text-sm font-medium text-slate-700 dark:text-slate-200">Sudoku</div>
        <div className="flex gap-1 text-[10px] font-medium">
          {Object.entries(SUDOKU_DIFFICULTIES).map(([k, d]) => (
            <button key={k} onClick={() => changeDifficulty(k)}
              className={`px-2 py-1 rounded-lg ${difficulty === k ? "text-white" : "bg-slate-100 dark:bg-slate-800 text-slate-500"}`}
              style={difficulty === k ? { background: "var(--accent)" } : {}}>{d.label}</button>
          ))}
        </div>
      </div>
      <div className="flex items-center justify-between mb-3 text-[10px] text-slate-400 flex-wrap gap-1.5">
        <div className="flex gap-3">
          <span>⏱ {fmtTime(seconds)}</span>
          <span className={mistakes > 0 ? "text-rose-500" : ""}>✗ {mistakes} mistake{mistakes === 1 ? "" : "s"}</span>
        </div>
        <div className="flex gap-1.5">
          <button onClick={() => newPuzzle()} className="text-xs px-2.5 py-1 rounded-lg bg-slate-100 dark:bg-slate-800">New Puzzle</button>
          <button onClick={check} className="text-xs px-2.5 py-1 rounded-lg text-white" style={{ background: "var(--accent)" }}>Check</button>
          <button onClick={reveal} className="text-xs px-2.5 py-1 rounded-lg bg-slate-100 dark:bg-slate-800">Reveal</button>
        </div>
      </div>
      <div className="grid grid-cols-9 w-full max-w-md mx-auto border-2 border-slate-400 dark:border-slate-600 rounded-lg overflow-hidden shadow-sm">
        {grid.map((v, i) => {
          const r = Math.floor(i / 9), c = i % 9;
          const fixed = game.puzzle[i] !== 0;
          const isSel = selected === i;
          const inSelRowCol = selected != null && (Math.floor(selected / 9) === r || selected % 9 === c);
          const inSelBox = selected != null && Math.floor(Math.floor(selected / 9) / 3) === Math.floor(r / 3) && Math.floor((selected % 9) / 3) === Math.floor(c / 3);
          const sameNum = selVal && v === selVal;
          const isConflict = conflicts.has(i);
          return (
            <input key={i} value={v || ""}
              onFocus={() => setSelected(i)}
              onChange={(e) => setCell(i, e.target.value)} disabled={fixed || result === "correct"} inputMode="numeric"
              className={`aspect-square text-center text-xs sm:text-sm outline-none border border-slate-200 dark:border-slate-700 transition-colors
                ${fixed ? "font-semibold text-slate-600 dark:text-slate-300" : "text-indigo-600 dark:text-indigo-300 font-medium"}
                ${isConflict ? "bg-rose-100 dark:bg-rose-950/50 text-rose-500" : isSel ? "bg-indigo-200 dark:bg-indigo-800/60" : sameNum ? "bg-indigo-100 dark:bg-indigo-900/40" : inSelRowCol || inSelBox ? "bg-slate-100 dark:bg-slate-800/70" : fixed ? "bg-slate-50 dark:bg-slate-800" : "bg-white dark:bg-slate-900"}
                ${c % 3 === 0 ? "border-l-2 border-l-slate-400 dark:border-l-slate-600" : ""}
                ${r % 3 === 0 ? "border-t-2 border-t-slate-400 dark:border-t-slate-600" : ""}
                ${c === 8 ? "border-r-2 border-r-slate-400 dark:border-r-slate-600" : ""}
                ${r === 8 ? "border-b-2 border-b-slate-400 dark:border-b-slate-600" : ""}`} />
          );
        })}
      </div>
      <p className="text-center text-[10px] text-slate-400 mt-2">Tap a cell to highlight its row, column, box and matching numbers.</p>
      {result && <p className={`text-center text-xs mt-2 font-medium ${result === "correct" ? "text-emerald-500" : "text-rose-500"}`}>{result === "correct" ? `Solved in ${fmtTime(seconds)} with ${mistakes} mistake${mistakes === 1 ? "" : "s"}! 🎉` : "A few cells don't match — keep trying."}</p>}
    </div>
  );
}

/* ---- Math 2: Tic-Tac-Toe (2-player or vs Robot) ---- */
const TTT_LINES = [[0, 1, 2], [3, 4, 5], [6, 7, 8], [0, 3, 6], [1, 4, 7], [2, 5, 8], [0, 4, 8], [2, 4, 6]];
function tttWinner(b) { for (const [a, c, d] of TTT_LINES) if (b[a] && b[a] === b[c] && b[a] === b[d]) return b[a]; return null; }
function tttMinimax(board, player) {
  const winner = tttWinner(board);
  if (winner === "O") return { score: 1 };
  if (winner === "X") return { score: -1 };
  if (board.every(Boolean)) return { score: 0 };
  let best = null;
  board.forEach((v, i) => {
    if (v) return;
    const next = board.slice(); next[i] = player;
    const { score } = tttMinimax(next, player === "O" ? "X" : "O");
    if (best === null || (player === "O" ? score > best.score : score < best.score)) best = { score, index: i };
  });
  return best;
}
function tttRobotMove(board, difficulty) {
  const empties = board.map((v, i) => (v ? null : i)).filter((v) => v !== null);
  if (difficulty === "easy" || Math.random() < 0.35) return empties[Math.floor(Math.random() * empties.length)];
  return tttMinimax(board, "O").index;
}
function TicTacToeGame({ push }) {
  const empty = Array(9).fill(null);
  const [mode, setMode] = useState("robot"); // "robot" | "two"
  const [difficulty, setDifficulty] = useState("hard"); // "easy" | "hard"
  const [board, setBoard] = useState(empty);
  const [turn, setTurn] = useState("X");
  const [scores, setScores] = useState({ X: 0, O: 0, draws: 0 });
  const winner = useMemo(() => tttWinner(board), [board]);
  const isDraw = !winner && board.every(Boolean);
  const gameOver = !!winner || isDraw;

  useEffect(() => {
    if (mode !== "robot" || turn !== "O" || gameOver) return;
    const t = setTimeout(() => {
      const i = tttRobotMove(board, difficulty);
      if (i != null) commitMove(i, "O");
    }, 450);
    return () => clearTimeout(t);
    // eslint-disable-next-line
  }, [board, turn, mode, gameOver]);

  const commitMove = (i, player) => {
    if (board[i]) return;
    const next = board.slice(); next[i] = player; setBoard(next);
    setTurn(player === "X" ? "O" : "X");
    const w = tttWinner(next);
    if (w) { setScores((s) => ({ ...s, [w]: s[w] + 1 })); push?.(mode === "robot" ? (w === "X" ? "You win! 🎉" : "Robot wins this one.") : `${w} wins!`, "success"); }
    else if (next.every(Boolean)) { setScores((s) => ({ ...s, draws: s.draws + 1 })); push?.("It's a draw.", "success"); }
  };
  const play = (i) => {
    if (gameOver || board[i]) return;
    if (mode === "robot" && turn !== "X") return;
    commitMove(i, turn);
  };
  const reset = () => { setBoard(empty); setTurn("X"); };
  const changeMode = (m) => { setMode(m); reset(); setScores({ X: 0, O: 0, draws: 0 }); };

  return (
    <div className="rounded-2xl border border-slate-200 dark:border-slate-800 p-4">
      <div className="flex items-center justify-between mb-2 flex-wrap gap-1.5">
        <div className="text-sm font-medium text-slate-700 dark:text-slate-200">Tic-Tac-Toe</div>
        <div className="text-xs text-slate-400">X {scores.X} · O {scores.O} · Draws {scores.draws}</div>

/* ---- Math 4: Number Merge (2048) ---- */
function emptyGrid4() { return Array.from({ length: 4 }, () => Array(4).fill(0)); }
function spawnTile(grid) {
  const empties = [];
  grid.forEach((row, r) => row.forEach((v, c) => { if (!v) empties.push([r, c]); }));
  if (!empties.length) return grid;
  const [r, c] = empties[Math.floor(Math.random() * empties.length)];
  const next = grid.map((row) => row.slice());
  next[r][c] = Math.random() < 0.9 ? 2 : 4;
  return next;
}
function slideRowLeft(row) {
  const vals = row.filter((v) => v);
  const merged = []; let gained = 0;
  for (let i = 0; i < vals.length; i++) {
    if (vals[i] === vals[i + 1]) { merged.push(vals[i] * 2); gained += vals[i] * 2; i++; }
    else merged.push(vals[i]);
  }
  while (merged.length < 4) merged.push(0);
  return { row: merged, gained };
}
function rotateGrid4(grid) {
  const next = emptyGrid4();
  for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) next[c][3 - r] = grid[r][c];
  return next;
}
function moveGrid4(grid, dir) {
  let g = grid;
  const rotations = { left: 0, up: 3, right: 2, down: 1 }[dir];
  for (let i = 0; i < rotations; i++) g = rotateGrid4(g);
  let gained = 0, moved = false;
  const next = g.map((row) => {
    const { row: newRow, gained: g2 } = slideRowLeft(row);
    if (newRow.some((v, i) => v !== row[i])) moved = true;
    gained += g2;
    return newRow;
  });
  let result = next;
  for (let i = 0; i < (4 - rotations) % 4; i++) result = rotateGrid4(result);
  return { grid: result, gained, moved };
}
const TILE_COLORS_2048 = { 2: "#e2e8f0", 4: "#cbd5e1", 8: "#fbbf24", 16: "#fb923c", 32: "#f97316", 64: "#ef4444", 128: "#f43f5e", 256: "#ec4899", 512: "#d946ef", 1024: "#a855f7", 2048: "#6366f1" };
function Number2048Game({ push }) {
  const [grid, setGrid] = useState(() => spawnTile(spawnTile(emptyGrid4())));
  const [score, setScore] = useState(0);

  const move = useCallback((dir) => {
    setGrid((g) => {
      const { grid: next, gained, moved } = moveGrid4(g, dir);
      if (!moved) return g;
      if (gained) setScore((s) => { const ns = s + gained; setBest(recordBest("2048", ns)); return ns; });
      return spawnTile(next);
    });
  }, []);

  useEffect(() => {
    const onKey = (e) => {
      const map = { ArrowLeft: "left", ArrowRight: "right", ArrowUp: "up", ArrowDown: "down" };
      if (map[e.key]) { e.preventDefault(); move(map[e.key]); }

    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);

  const reset = () => { setGrid(spawnTile(spawnTile(emptyGrid4()))); setScore(0); };
  const full = grid.every((row) => row.every((v) => v));

/* ---- Math 5: Quick Math Sprint ---- */
function makeMathProblem() {
  const ops = ["+", "-", "×"];
  const op = ops[Math.floor(Math.random() * ops.length)];
  let a = Math.floor(Math.random() * 12) + 1, b = Math.floor(Math.random() * 12) + 1;
  if (op === "-" && b > a) [a, b] = [b, a];
  const answer = op === "+" ? a + b : op === "-" ? a - b : a * b;
  return { text: `${a} ${op} ${b}`, answer };
}
function QuickMathSprint({ push }) {
  const [running, setRunning] = useState(false);
  const [timeLeft, setTimeLeft] = useState(60);
  const [problem, setProblem] = useState(() => makeMathProblem());
  const [input, setInput] = useState("");
  const [score, setScore] = useState(0);
  const [best, setBest] = useState(() => getBest("mathSprint", 0));
  const timerRef = useRef(null);

  const start = () => {
    setRunning(true); setTimeLeft(60); setScore(0); setProblem(makeMathProblem()); setInput("");
    clearInterval(timerRef.current);

      setTimeLeft((t) => {
        if (t <= 1) { clearInterval(timerRef.current); setRunning(false); return 0; }
        return t - 1;
      });
    }, 1000);
  };
  useEffect(() => () => clearInterval(timerRef.current), []);
  useEffect(() => { if (!running && timeLeft === 0 && score > 0) { const nb = recordBest("mathSprint", score); setBest(nb); push?.(`Time's up — you scored ${score}!`, "success"); } }, [running]);

  const submit = () => {

/* ---- Math 6: Memory Match (equivalent expressions) ---- */
function makeMemoryDeck() {
  const pairs = [
    ["3 + 4", "7"], ["6 × 2", "12"], ["15 − 9", "6"], ["9 ÷ 3", "3"],
    ["2³", "8"], ["√81", "9"], ["5 × 5", "25"], ["10 − 4", "6"],
  ];
  const chosen = shuffleArr(pairs).slice(0, 6);
  const cards = chosen.flatMap(([a, b], i) => [{ id: `${i}a`, pairId: i, label: a }, { id: `${i}b`, pairId: i, label: b }]);
  return shuffleArr(cards);
}
function MathMemoryMatch({ push }) {
  const [deck, setDeck] = useState(() => makeMemoryDeck());
  const [flipped, setFlipped] = useState([]);
  const [matched, setMatched] = useState(new Set());
  const [moves, setMoves] = useState(0);
  const [best, setBest] = useState(() => getBest("mathMemory", Infinity));
  const solved = matched.size === deck.length;

  useEffect(() => { if (solved && deck.length) { const nb = recordBest("mathMemory", moves, false); setBest(nb); push?.(`Matched everything in ${moves} moves!`, "success"); } }, [solved]);

  const flip = (card) => {
    if (flipped.length === 2 || matched.has(card.pairId) || flipped.some((f) => f.id === card.id)) return;
    const next = [...flipped, card];
    setFlipped(next);
    if (next.length === 2) {
      setMoves((m) => m + 1);
      if (next[0].pairId === next[1].pairId) {
        setMatched((s) => new Set([...s, next[0].pairId]));
        setTimeout(() => setFlipped([]), 400);
      } else {
        setTimeout(() => setFlipped([]), 800);
      }
    }
  };
  const reset = () => { setDeck(makeMemoryDeck()); setFlipped([]); setMatched(new Set()); setMoves(0); };

  return (
    <div className="rounded-2xl border border-slate-200 dark:border-slate-800 p-4">
      <div className="flex items-center justify-between mb-2">
        <div className="text-sm font-medium text-slate-700 dark:text-slate-200">Math Memory Match</div>
        <div className="text-xs text-slate-400">Moves {moves} · Best {best === Infinity ? "—" : best}</div>
      </div>
      <p className="text-xs text-slate-400 mb-3">Flip two cards at a time to match each expression with its value.</p>
      <div className="grid grid-cols-4 gap-1.5 max-w-sm mx-auto mb-3">
        {deck.map((card) => {
          const isFlipped = matched.has(card.pairId) || flipped.some((f) => f.id === card.id);
          return (
            <button key={card.id} onClick={() => flip(card)}
              className={`aspect-square rounded-lg flex items-center justify-center text-xs font-semibold transition
                ${matched.has(card.pairId) ? "bg-emerald-100 dark:bg-emerald-950/40 text-emerald-600" : isFlipped ? "bg-indigo-50 dark:bg-indigo-950/40 text-indigo-500" : "bg-slate-100 dark:bg-slate-800 text-transparent"}`}>
              {isFlipped ? card.label : "?"}
            </button>
          );
        })}
      </div>
      {solved && <p className="text-center text-xs text-emerald-500 mb-2">All matched! 🎉</p>}
      <button onClick={reset} className="w-full text-xs py-1.5 rounded-lg bg-slate-100 dark:bg-slate-800">Shuffle Deck</button>
    </div>
  );
}
