  return {
    COLS, ROWS, battery, bulb,
    resistor: { a: nodeKey(1, resistorCol), b: nodeKey(1, resistorCol + 1), value: resistorValue },
    diode: { a: diodeForward ? nodeKey(1, diodeCol) : nodeKey(1, diodeCol + 1), b: diodeForward ? nodeKey(1, diodeCol + 1) : nodeKey(1, diodeCol), forward: diodeForward, col: diodeCol },
    capacitor: { a: nodeKey(1, capacitorCol), b: nodeKey(1, capacitorCol + 1) },
  };
}
function CircuitBuilderGame({ push }) {
  const nodeKey = (r, c) => `${r}-${c}`;
  const [puzzle, setPuzzle] = useState(() => makeCircuitPuzzle());
  const [wires, setWires] = useState(() => new Set());
  const [showManual, setShowManual] = useState(false);
  const [flash, setFlash] = useState(true);
  const { COLS, ROWS, battery, bulb, resistor, diode, capacitor } = puzzle;

  const edgeId = (a, b) => [a, b].sort().join("|");
  const toggleWire = (a, b) => {
    const id = edgeId(a, b);
    setWires((w) => { const next = new Set(w); if (next.has(id)) next.delete(id); else next.add(id); return next; });
  };
  const newCircuit = () => { setPuzzle(makeCircuitPuzzle()); setWires(new Set()); };

  const { lit, usesResistor, usesCapacitor } = useMemo(() => {
    const adj = {};
    const addEdge = (a, b) => { (adj[a] ??= []).push(b); (adj[b] ??= []).push(a); };
    wires.forEach((id) => { const [a, b] = id.split("|"); addEdge(a, b); });
    addEdge(resistor.a, resistor.b);
    addEdge(capacitor.a, capacitor.b);
    (adj[diode.a] ??= []).push(diode.b); // diode only conducts a → b (its forward direction)
    const seen = new Set([battery.pos]);
    const queue = [battery.pos];
    let touchedBulbA = battery.pos === bulb.a, touchedBulbB = battery.pos === bulb.b;
    while (queue.length) {
      const cur = queue.shift();
      for (const next of adj[cur] || []) {
        if (seen.has(next)) continue;
        seen.add(next);
        if (next === bulb.a) touchedBulbA = true;
        if (next === bulb.b) touchedBulbB = true;
        queue.push(next);
      }
    }
    const isLit = touchedBulbA && touchedBulbB && seen.has(battery.neg);
    return { lit: isLit, usesResistor: isLit && seen.has(resistor.a) && seen.has(resistor.b), usesCapacitor: isLit && seen.has(capacitor.a) && seen.has(capacitor.b) };
  }, [wires, puzzle]);

  useEffect(() => { if (lit) push?.(usesCapacitor ? "Circuit closed — the capacitor is making it flash! ⚡" : "Circuit closed — bulb lit! 💡", "success"); }, [lit]);
  useEffect(() => {
    if (!lit || !usesCapacitor) { setFlash(true); return; }
    const t = setInterval(() => setFlash((f) => !f), 450);
    return () => clearInterval(t);
  }, [lit, usesCapacitor]);
  const bulbOn = lit && (!usesCapacitor || flash);

  const W = 320, H = 200;
  const stepX = W / (COLS - 1), stepY = H / (ROWS - 1);
  const nodes = [];
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) nodes.push({ r, c, key: nodeKey(r, c) });
  const pos = (key) => { const [r, c] = key.split("-").map(Number); return { x: c * stepX, y: r * stepY }; };
  const isFixedEdge = (a, b) => edgeId(a, b) === edgeId(resistor.a, resistor.b) || edgeId(a, b) === edgeId(diode.a, diode.b) || edgeId(a, b) === edgeId(capacitor.a, capacitor.b);
  const isSpecial = (key) => [battery.pos, battery.neg, bulb.a, bulb.b].includes(key);

  const ResistorSymbol = ({ x1, y1, x2, y2 }) => {
    const dx = x2 - x1, dy = y2 - y1, midx = (x1 + x2) / 2, midy = (y1 + y2) / 2;
    const ux = dx / Math.hypot(dx, dy), uy = dy / Math.hypot(dx, dy); const px = -uy, py = ux;
    const zig = [-1, 1, -1, 1, -1, 1].map((s, i) => { const t = -18 + i * 7.2; return `${midx + ux * t + px * s * 6},${midy + uy * t + py * s * 6}`; });
    return <polyline points={`${x1},${y1} ${midx - ux * 18},${midy - uy * 18} ${zig.join(" ")} ${midx + ux * 18},${midy + uy * 18} ${x2},${y2}`} fill="none" stroke={usesResistor && lit ? "#f59e0b" : "#6366f1"} strokeWidth="2.5" strokeLinejoin="round" />;
  };
  const DiodeSymbol = ({ x1, y1, x2, y2 }) => {
    const dx = x2 - x1, dy = y2 - y1, midx = (x1 + x2) / 2, midy = (y1 + y2) / 2;
    const ux = dx / Math.hypot(dx, dy), uy = dy / Math.hypot(dx, dy); const px = -uy, py = ux;
    const tipx = midx - ux * 9, tipy = midy - uy * 9, backx = midx + ux * 9, backy = midy + uy * 9;
    const p1 = `${midx - ux * 9 + px * 8},${midy - uy * 9 + py * 8}`;
    const p2 = `${midx - ux * 9 - px * 8},${midy - uy * 9 - py * 8}`;
    const color = lit ? "#f59e0b" : "#ef4444";
    return (
      <g>
        <line x1={x1} y1={y1} x2={x2} y2={y2} stroke={color} strokeWidth="2" opacity="0.35" />
        <polygon points={`${tipx},${tipy} ${p1} ${p2}`} fill={color} />
        <line x1={backx + px * 8} y1={backy + py * 8} x2={backx - px * 8} y2={backy - py * 8} stroke={color} strokeWidth="3" />
      </g>
    );
  };
  const CapacitorSymbol = ({ x1, y1, x2, y2 }) => {
    const dx = x2 - x1, dy = y2 - y1, midx = (x1 + x2) / 2, midy = (y1 + y2) / 2;
    const ux = dx / Math.hypot(dx, dy), uy = dy / Math.hypot(dx, dy); const px = -uy, py = ux;
    const color = lit ? "#f59e0b" : "#22c55e";
    const platesep = 5;
    return (
      <g>
        <line x1={x1} y1={y1} x2={midx - ux * platesep} y2={midy - uy * platesep} stroke={color} strokeWidth="2.5" />
        <line x1={midx + ux * platesep} y1={midy + uy * platesep} x2={x2} y2={y2} stroke={color} strokeWidth="2.5" />
        <line x1={midx - ux * platesep + px * 9} y1={midy - uy * platesep + py * 9} x2={midx - ux * platesep - px * 9} y2={midy - uy * platesep - py * 9} stroke={color} strokeWidth="3" />
        <line x1={midx + ux * platesep + px * 9} y1={midy + uy * platesep + py * 9} x2={midx + ux * platesep - px * 9} y2={midy + uy * platesep - py * 9} stroke={color} strokeWidth="3" />
      </g>
    );
  };

  return (
    <div className="rounded-2xl border border-slate-200 dark:border-slate-800 p-4">
      <div className="flex items-center justify-between mb-2 flex-wrap gap-1.5">
        <div className="text-sm font-medium text-slate-700 dark:text-slate-200">Circuit Builder</div>
        <div className="flex gap-1.5">
          <button onClick={() => setShowManual((v) => !v)} className="text-xs px-2.5 py-1 rounded-lg bg-slate-100 dark:bg-slate-800">{showManual ? "Hide" : "Show"} Manual</button>
          <button onClick={() => setWires(new Set())} className="text-xs px-2.5 py-1 rounded-lg bg-slate-100 dark:bg-slate-800">Clear Wires</button>
          <button onClick={newCircuit} className="text-xs px-2.5 py-1 rounded-lg text-white" style={{ background: "var(--accent)" }}>New Circuit</button>
        </div>
      </div>
      <p className="text-xs text-slate-400 mb-3">Click adjacent dots to lay a wire. Route a path from the battery (+/−) through to the bulb — the resistor, diode and capacitor are already soldered into the middle row, in a fresh layout every round.</p>

      {showManual && (
        <div className="rounded-xl bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 p-3 mb-3 text-[10.5px] text-slate-600 dark:text-slate-300 grid sm:grid-cols-2 gap-x-4 gap-y-1.5">
          <div className="font-semibold col-span-2 text-slate-500 dark:text-slate-400 flex items-center gap-1"><BookOpen className="w-3 h-3" /> Component Manual</div>
          <div><strong style={{ color: "#6366f1" }}>▨ Resistor</strong> — always conducts; here it's {resistor.value}Ω. Limits current, doesn't block it.</div>
          <div><strong style={{ color: "#ef4444" }}>▷| Diode</strong> — only lets current through in the direction of its arrow. Wire it backward and that path stays dark.</div>
          <div><strong style={{ color: "#22c55e" }}>=| Capacitor</strong> — stores charge, then releases it, so any path through it makes the bulb flash instead of staying steady.</div>
          <div><strong className="text-amber-500">◎ Bulb</strong> — lights up once a complete path connects battery + to battery −.</div>
        </div>
      )}

      <div className="relative mx-auto" style={{ width: W, height: H, marginTop: 14, marginBottom: 6 }}>
        <div className="absolute text-[9px] text-emerald-500 font-semibold" style={{ left: -8, top: pos(battery.pos).y - 10 }}>+</div>
        <div className="absolute text-[9px] text-rose-500 font-semibold" style={{ left: -8, top: pos(battery.neg).y - 10 }}>−</div>
        <div className="absolute" style={{ left: W + 6, top: pos(bulb.a).y + (pos(bulb.b).y - pos(bulb.a).y) / 2 - 8 }}>
          <Lightbulb className={`w-4 h-4 ${bulbOn ? "text-amber-400 drop-shadow-[0_0_6px_rgba(245,158,11,0.8)]" : "text-slate-300 dark:text-slate-600"}`} />
        </div>
        <svg width={W} height={H} className="absolute inset-0 overflow-visible">
          {nodes.map(({ r, c, key }) => {
            const { x, y } = pos(key);
            const segs = [];
            if (c < COLS - 1) {
              const b = nodeKey(r, c + 1);
              const fixed = isFixedEdge(key, b);
              const active = wires.has(edgeId(key, b)) || fixed;
              segs.push({ x1: x, y1: y, x2: x + stepX, y2: y, key: "h" + key, a: key, b, active, fixed });
            }
            if (r < ROWS - 1) { const b = nodeKey(r + 1, c); const active = wires.has(edgeId(key, b)); segs.push({ x1: x, y1: y, x2: x, y2: y + stepY, key: "v" + key, a: key, b, active, fixed: false }); }
            return segs.map((e) => {
              if (edgeId(e.a, e.b) === edgeId(resistor.a, resistor.b)) return <g key={e.key}><line x1={e.x1} y1={e.y1} x2={e.x2} y2={e.y2} stroke="transparent" strokeWidth="14" /><ResistorSymbol {...e} /></g>;
              if (edgeId(e.a, e.b) === edgeId(diode.a, diode.b)) return <g key={e.key} transform={diode.a === e.a ? "" : `rotate(180, ${(e.x1 + e.x2) / 2}, ${(e.y1 + e.y2) / 2})`}><DiodeSymbol {...e} /></g>;
              if (edgeId(e.a, e.b) === edgeId(capacitor.a, capacitor.b)) return <g key={e.key}><line x1={e.x1} y1={e.y1} x2={e.x2} y2={e.y2} stroke="transparent" strokeWidth="14" /><CapacitorSymbol {...e} /></g>;
              return (
                <line key={e.key} x1={e.x1} y1={e.y1} x2={e.x2} y2={e.y2}
                  stroke={e.active ? (lit ? "#f59e0b" : "#6366f1") : "#e2e8f0"} strokeWidth={e.active ? 4 : 2}
                  className="cursor-pointer" onClick={() => toggleWire(e.a, e.b)} />
              );
            });
          })}
        </svg>
        {nodes.map(({ key }) => { const { x, y } = pos(key); return <div key={key} className={`absolute w-2.5 h-2.5 rounded-full -translate-x-1/2 -translate-y-1/2 pointer-events-none ${isSpecial(key) ? "bg-slate-500" : "bg-slate-300 dark:bg-slate-600"}`} style={{ left: x, top: y }} />; })}
      </div>
      <p className="text-center text-[10px] text-slate-400">Resistor {resistor.value}Ω · diode conducts one way only · capacitor makes the bulb flash when included.</p>
      {lit && <p className="text-center text-xs text-amber-500 font-medium mt-1">{usesCapacitor ? "Bulb flashing! ⚡" : "Bulb is lit! 💡"}</p>}
    </div>
  );
}

/* ---- Physics 2: Projectile Launch ---- */
function ProjectileLaunchGame({ push }) {
  const [angle, setAngle] = useState(45);
  const [velocity, setVelocity] = useState(30);
  const [target, setTarget] = useState(() => 60 + Math.random() * 120);
  const [result, setResult] = useState(null);
  const [best, setBest] = useState(() => getBest("projectile", 0));
  const canvasRef = useRef(null);
  const g = 9.8;

  const draw = (landingX = null) => {
    const canvas = canvasRef.current; if (!canvas) return;
    const ctx = canvas.getContext("2d");
    const W = canvas.width, H = canvas.height, scale = W / 220;
    ctx.clearRect(0, 0, W, H);
    ctx.strokeStyle = "#cbd5e1"; ctx.beginPath(); ctx.moveTo(0, H - 20); ctx.lineTo(W, H - 20); ctx.stroke();
    // target
    ctx.fillStyle = "#ef4444"; ctx.beginPath(); ctx.arc(target * scale, H - 20, 6, 0, Math.PI * 2); ctx.fill();
    // trajectory
    const rad = (angle * Math.PI) / 180;
    const vx = velocity * Math.cos(rad), vy = velocity * Math.sin(rad);
    const flightTime = (2 * vy) / g;
    ctx.strokeStyle = "#6366f1"; ctx.lineWidth = 2; ctx.beginPath();
    for (let t = 0; t <= flightTime; t += flightTime / 60) {
      const x = vx * t, y = vy * t - 0.5 * g * t * t;
      const px = x * scale, py = H - 20 - y * scale;
      if (t === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.stroke();
    if (landingX != null) { ctx.fillStyle = "#22c55e"; ctx.beginPath(); ctx.arc(landingX * scale, H - 20, 5, 0, Math.PI * 2); ctx.fill(); }
  };
  useEffect(() => { draw(); }, [angle, velocity, target]);

  const launch = () => {
    const rad = (angle * Math.PI) / 180;
    const vx = velocity * Math.cos(rad), vy = velocity * Math.sin(rad);
    const range = (2 * vx * vy) / g;
    draw(range);
    const dist = Math.abs(range - target);
    if (dist < 4) {
      push?.(`Direct hit! Landed ${range.toFixed(1)}m vs target ${target.toFixed(1)}m.`, "success");
      const nb = recordBest("projectile", 1); setBest(nb);
      setTarget(60 + Math.random() * 120);
    } else {
      push?.(`Landed ${range.toFixed(1)}m — target was ${target.toFixed(1)}m (off by ${dist.toFixed(1)}m).`, "error");
    }
    setResult({ range, dist });
  };

  return (
    <div className="rounded-2xl border border-slate-200 dark:border-slate-800 p-4">
      <div className="flex items-center justify-between mb-2">
        <div className="text-sm font-medium text-slate-700 dark:text-slate-200">Projectile Launch</div>
        <div className="text-xs text-slate-400">Direct hits {best}</div>
      </div>
      <p className="text-xs text-slate-400 mb-3">Dial in launch angle and velocity to land on the red target (range = v²·sin(2θ)/g).</p>
      <canvas ref={canvasRef} width={280} height={140} className="w-full rounded-lg bg-slate-50 dark:bg-slate-800/40 mb-3" />
      <div className="space-y-2 mb-3">
        <div className="flex items-center justify-between text-xs text-slate-400"><span>Angle</span><span>{angle}°</span></div>
        <input type="range" min="5" max="85" value={angle} onChange={(e) => setAngle(Number(e.target.value))} className="w-full" />
        <div className="flex items-center justify-between text-xs text-slate-400"><span>Velocity</span><span>{velocity} m/s</span></div>
        <input type="range" min="10" max="50" value={velocity} onChange={(e) => setVelocity(Number(e.target.value))} className="w-full" />
      </div>
      <button onClick={launch} className="w-full text-xs py-1.5 rounded-lg text-white" style={{ background: "var(--accent)" }}>Launch</button>
      {result && <p className="text-center text-xs text-slate-400 mt-2">Last shot landed at {result.range.toFixed(1)}m.</p>}
    </div>
  );
}

/* ---- Physics 3: Free-Fall Reaction Test ---- */
function ReactionDropGame({ push }) {
  const [state, setState] = useState("idle"); // idle | waiting | dropped | early | result
  const [dropTime, setDropTime] = useState(null);
  const [reactionMs, setReactionMs] = useState(null);
  const [best, setBest] = useState(() => getBest("reactionTest", Infinity));
  const timeoutRef = useRef(null);
  const g = 9.8;

  const start = () => {
    setState("waiting"); setReactionMs(null);
    const delay = 1200 + Math.random() * 2500;
    timeoutRef.current = setTimeout(() => { setDropTime(performance.now()); setState("dropped"); }, delay);
  };
  const click = () => {
    if (state === "waiting") { clearTimeout(timeoutRef.current); setState("early"); return; }
    if (state === "dropped") {
      const ms = performance.now() - dropTime;
      setReactionMs(ms);
      const nb = recordBest("reactionTest", ms, false); setBest(nb);
      setState("result");
      push?.(`Reaction time ${ms.toFixed(0)}ms.`, "success");
    }
  };
  useEffect(() => () => clearTimeout(timeoutRef.current), []);

  const distanceFallen = reactionMs != null ? 0.5 * g * (reactionMs / 1000) ** 2 : 0;

  return (
    <div className="rounded-2xl border border-slate-200 dark:border-slate-800 p-4">
      <div className="flex items-center justify-between mb-2">
        <div className="text-sm font-medium text-slate-700 dark:text-slate-200">Free-Fall Reaction Test</div>
        <div className="text-xs text-slate-400">Best {best === Infinity ? "—" : `${best.toFixed(0)}ms`}</div>
      </div>
      <p className="text-xs text-slate-400 mb-3">The classic ruler-drop demo: tap the moment the circle drops, and we'll compute your reaction time and how far it fell using d = ½gt².</p>
      <button onClick={state === "idle" || state === "early" || state === "result" ? start : click}
        className={`w-full h-36 rounded-xl flex items-center justify-center text-sm font-medium transition ${state === "dropped" ? "bg-amber-400 text-white" : state === "waiting" ? "bg-slate-100 dark:bg-slate-800 text-slate-400" : "bg-slate-50 dark:bg-slate-800/60 text-slate-500"}`}>
        {state === "idle" && "Tap to start"}
        {state === "waiting" && "Wait for it…"}
        {state === "dropped" && "TAP NOW!"}
        {state === "early" && "Too soon — tap to retry"}
        {state === "result" && `${reactionMs.toFixed(0)}ms — fell ~${distanceFallen.toFixed(2)}m. Tap to retry`}
      </button>
      {state === "dropped" && <button onClick={click} className="w-full text-xs py-1.5 rounded-lg text-white mt-3" style={{ background: "var(--accent)" }}>Stop!</button>}
    </div>
  );
}

/* ---- Physics 4: Ohm's Law Quiz ---- */
function makeOhmRound() {
  const known = shuffleArr(["V", "I", "R"])[0]; // the value we ask the player to solve for
  const I = (Math.floor(Math.random() * 8) + 1); // 1-8 A
  const R = (Math.floor(Math.random() * 10) + 1) * 5; // 5-50 ohm
  const V = I * R;
  const answer = known === "V" ? V : known === "I" ? I : R;
  return { V, I, R, known, answer };
}
function OhmsLawQuiz({ push }) {
  const [round, setRound] = useState(() => makeOhmRound());
  const [input, setInput] = useState("");
  const [score, setScore] = useState(0);
  const [asked, setAsked] = useState(0);
  const [best, setBest] = useState(() => getBest("ohmsLaw", 0));

  const submit = () => {
    const correct = Math.abs(Number(input) - round.answer) < 0.01;
    setAsked((a) => a + 1);
    if (correct) {
      setScore((s) => { const ns = s + 1; setBest(recordBest("ohmsLaw", ns)); return ns; });
      push?.("Correct — V = I × R checks out!", "success");
    } else {
      push?.(`Not quite — the answer was ${round.answer}.`, "error");
    }
    setRound(makeOhmRound()); setInput("");
  };
  const label = { V: "Voltage (V)", I: "Current (I)", R: "Resistance (R)" }[round.known];
  const unit = { V: "V", I: "A", R: "Ω" }[round.known];

  return (
    <div className="rounded-2xl border border-slate-200 dark:border-slate-800 p-4">
      <div className="flex items-center justify-between mb-2">
        <div className="text-sm font-medium text-slate-700 dark:text-slate-200">Ohm's Law Quiz</div>
        <div className="text-xs text-slate-400">Score {score}/{asked} · Best {best}</div>
      </div>
      <p className="text-xs text-slate-400 mb-3">V = I × R. Given two values, solve for the missing one.</p>
      <div className="flex items-center justify-center gap-4 mb-4 text-sm">
        {["V", "I", "R"].map((k) => (
          <div key={k} className="text-center">
            <div className="text-slate-400 text-[10px] mb-1">{k === "V" ? "Voltage" : k === "I" ? "Current" : "Resistance"}</div>
            <div className={`w-16 h-10 rounded-lg flex items-center justify-center font-bold ${k === round.known ? "bg-amber-100 dark:bg-amber-950/40 text-amber-500" : "bg-slate-100 dark:bg-slate-800"}`}>
              {k === round.known ? "?" : `${round[k]}${{ V: "V", I: "A", R: "Ω" }[k]}`}
            </div>
          </div>
        ))}
      </div>
      <input autoFocus value={input} onChange={(e) => setInput(e.target.value)} onKeyDown={(e) => e.key === "Enter" && submit()}
        placeholder={`${label} in ${unit}`} inputMode="decimal"
        className="w-full text-center text-lg rounded-lg border border-slate-200 dark:border-slate-700 bg-transparent px-3 py-2 outline-none mb-2" />
      <button onClick={submit} className="w-full text-xs py-1.5 rounded-lg text-white" style={{ background: "var(--accent)" }}>Submit</button>
    </div>
  );
}

/* ---- Physics 5: Pendulum Lab ---- */
function PendulumLab({ push }) {
  const [length, setLength] = useState(1); // meters
  const [target, setTarget] = useState(() => 0.5 + Math.random() * 2.5);
  const [guess, setGuess] = useState("");
  const [result, setResult] = useState(null);
  const [best, setBest] = useState(() => getBest("pendulum", 0));
  const g = 9.8;
  const period = 2 * Math.PI * Math.sqrt(length / g);
  const targetPeriod = 2 * Math.PI * Math.sqrt(target / g);

  const submit = () => {
    const dist = Math.abs(Number(guess) - target);
    if (dist < 0.15) {
      push?.(`Nice! Length was ${target.toFixed(2)}m (period ${targetPeriod.toFixed(2)}s).`, "success");
      const nb = recordBest("pendulum", 1, false); setBest(nb);
      setTarget(0.5 + Math.random() * 2.5);
    } else {
      push?.(`Off by ${dist.toFixed(2)}m — actual length was ${target.toFixed(2)}m.`, "error");
    }
    setResult({ dist }); setGuess("");
  };

  return (
    <div className="rounded-2xl border border-slate-200 dark:border-slate-800 p-4">
      <div className="flex items-center justify-between mb-2">
        <div className="text-sm font-medium text-slate-700 dark:text-slate-200">Pendulum Lab</div>

/* ---- CS 1: Binary Converter Challenge ---- */

/* ---- CS 2: Sorting Race ---- */
function SortingRaceGame({ push }) {
  const N = 8;
  const makeArr = () => shuffleArr(Array.from({ length: N }, (_, i) => i + 1));
  const [arr, setArr] = useState(makeArr);
  const [selected, setSelected] = useState(null);
  const [moves, setMoves] = useState(0);
  const sorted = arr.every((v, i) => v === i + 1);
  const optimal = useMemo(() => {
    // minimum swaps = n - number of cycles
    const a = arr.map((v, i) => [v, i]);
    const visited = Array(N).fill(false);
    let cycles = 0;
    for (let i = 0; i < N; i++) {
      if (visited[i] || a[i][0] === i + 1) { if (a[i][0] === i + 1) visited[i] = true; continue; }
      let j = i, len = 0;
      while (!visited[j]) { visited[j] = true; j = arr[j] - 1; len++; }
      if (len) cycles++;
    }
    return N - cycles;
  }, []);

  useEffect(() => { if (sorted && moves > 0) { recordBest("sorting", moves, false); push?.(`Sorted in ${moves} swaps (optimal was ${optimal}).`, "success"); } }, [sorted]);

  const clickBar = (i) => {
    if (sorted) return;
    if (selected == null) { setSelected(i); return; }
    if (selected === i) { setSelected(null); return; }
    const next = arr.slice(); [next[selected], next[i]] = [next[i], next[selected]];
    setArr(next); setMoves((m) => m + 1); setSelected(null);
  };
  const reset = () => { setArr(makeArr()); setMoves(0); setSelected(null); };

  return (
    <div className="rounded-2xl border border-slate-200 dark:border-slate-800 p-4">
      <div className="flex items-center justify-between mb-2">
        <div className="text-sm font-medium text-slate-700 dark:text-slate-200">Sorting Race</div>
        <div className="text-xs text-slate-400">Moves {moves} · Optimal {optimal}</div>
      </div>
      <p className="text-xs text-slate-400 mb-3">Click two bars to swap them. Sort ascending in as few swaps as possible.</p>
      <div className="flex items-end gap-1.5 h-32 mb-3">
        {arr.map((v, i) => (
          <button key={i} onClick={() => clickBar(i)} className={`flex-1 rounded-t-md flex items-end justify-center text-[10px] text-white font-medium pb-1 transition ${selected === i ? "ring-2 ring-indigo-400" : ""}`}
            style={{ height: `${(v / N) * 100}%`, background: sorted ? "#22c55e" : "var(--accent)" }}>{v}</button>
        ))}
      </div>
      {sorted && <p className="text-center text-xs text-emerald-500 mb-2">Sorted in {moves} swaps! 🎉</p>}
      <button onClick={reset} className="w-full text-xs py-1.5 rounded-lg bg-slate-100 dark:bg-slate-800">Shuffle</button>
    </div>
  );
}

/* ---- CS 3: Logic Gate Challenge ---- */
const LOGIC_GATES = {
  AND: (a, b) => a & b, OR: (a, b) => a | b, XOR: (a, b) => a ^ b,
  NAND: (a, b) => (a & b) ? 0 : 1, NOR: (a, b) => (a | b) ? 0 : 1, XNOR: (a, b) => (a ^ b) ? 0 : 1,
};
function LogicGateGame({ push }) {
  const gateNames = Object.keys(LOGIC_GATES);
  const [round, setRound] = useState(() => makeRound());
  const [score, setScore] = useState(0);
  const [streak, setStreak] = useState(0);
  const [best, setBest] = useState(() => getBest("logicGate", 0));

  function makeRound() {
    const target = gateNames[Math.floor(Math.random() * gateNames.length)];
    const a = Math.round(Math.random()), b = Math.round(Math.random());
    return { a, b, target, output: LOGIC_GATES[target](a, b) };
  }
  const guess = (gate) => {
    const correct = LOGIC_GATES[gate](round.a, round.b) === round.output && gate === round.target;
    // Accept any gate whose output matches (some gates may coincide for given a,b — still require exact gate match for learning purposes)
    if (gate === round.target) {
      setScore((s) => s + 1); setStreak((s) => { const ns = s + 1; setBest(recordBest("logicGate", ns)); return ns; });
      push?.("Correct gate!", "success");
    } else {
      setStreak(0);
      push?.(`Not quite — that round's gate was ${round.target}.`, "error");
    }
    setRound(makeRound());
  };

  return (
    <div className="rounded-2xl border border-slate-200 dark:border-slate-800 p-4">
      <div className="flex items-center justify-between mb-2">
        <div className="text-sm font-medium text-slate-700 dark:text-slate-200">Logic Gate Challenge</div>
        <div className="text-xs text-slate-400">Score {score} · Best streak {best}</div>
      </div>
      <p className="text-xs text-slate-400 mb-3">Given the inputs and output below, pick which logic gate produced it.</p>
      <div className="flex items-center justify-center gap-4 mb-4 text-sm">
        <div className="text-center"><div className="text-slate-400 text-[10px] mb-1">A</div><div className="w-8 h-8 rounded-lg bg-slate-100 dark:bg-slate-800 flex items-center justify-center font-bold">{round.a}</div></div>
        <div className="text-center"><div className="text-slate-400 text-[10px] mb-1">B</div><div className="w-8 h-8 rounded-lg bg-slate-100 dark:bg-slate-800 flex items-center justify-center font-bold">{round.b}</div></div>
        <ChevronRight className="w-4 h-4 text-slate-300" />
        <div className="text-center"><div className="text-slate-400 text-[10px] mb-1">Output</div><div className="w-8 h-8 rounded-lg flex items-center justify-center font-bold text-white" style={{ background: "var(--accent)" }}>{round.output}</div></div>
      </div>
      <div className="grid grid-cols-3 gap-1.5">
        {gateNames.map((g) => (
          <button key={g} onClick={() => guess(g)} className="text-xs py-2 rounded-lg bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 font-medium">{g}</button>
        ))}
      </div>
    </div>
  );
}

/* ---- CS 4: Simon Pattern Memory ---- */
function SimonMemoryGame({ push }) {
  const PADS = [
    { id: 0, color: "#ef4444", tone: 261.6 }, { id: 1, color: "#22c55e", tone: 329.6 },
    { id: 2, color: "#3b82f6", tone: 392.0 }, { id: 3, color: "#f59e0b", tone: 493.9 },
  ];
  const [sequence, setSequence] = useState([]);
  const [userStep, setUserStep] = useState(0);
  const [playing, setPlaying] = useState(false);
  const [active, setActive] = useState(null);
  const [status, setStatus] = useState("idle"); // idle | showing | input | over
  const [best, setBest] = useState(() => getBest("simon", 0));
  const ctxRef = useRef(null);

  const beep = (tone) => {
    try {
      const ctx = ctxRef.current || (ctxRef.current = new (window.AudioContext || window.webkitAudioContext)());
      const osc = ctx.createOscillator(); const gain = ctx.createGain();
      osc.frequency.value = tone; osc.type = "sine"; gain.gain.value = 0.08;
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(); osc.stop(ctx.currentTime + 0.22);
    } catch {}
  };

  const playSequence = async (seq) => {
    setStatus("showing");
    for (let i = 0; i < seq.length; i++) {
      await new Promise((r) => setTimeout(r, 350));
      setActive(seq[i]); beep(PADS[seq[i]].tone);
      await new Promise((r) => setTimeout(r, 300));
      setActive(null);
    }
    setStatus("input"); setUserStep(0);
  };

  const start = () => {
    const seq = [Math.floor(Math.random() * 4)];
    setSequence(seq); setPlaying(true);
    playSequence(seq);
  };
  const nextRound = (seq) => { const ns = [...seq, Math.floor(Math.random() * 4)]; setSequence(ns); playSequence(ns); };

  const press = (id) => {
    if (status !== "input") return;
    beep(PADS[id].tone);
    if (sequence[userStep] !== id) {
      setStatus("over"); setPlaying(false);
      const nb = recordBest("simon", sequence.length); setBest(nb);
      push?.(`Game over — you reached a sequence of ${sequence.length}.`, "error");
      return;
    }
    if (userStep + 1 === sequence.length) {
      setTimeout(() => nextRound(sequence), 500);
    } else {
      setUserStep((s) => s + 1);
    }
  };

  return (
    <div className="rounded-2xl border border-slate-200 dark:border-slate-800 p-4">
      <div className="flex items-center justify-between mb-2">
        <div className="text-sm font-medium text-slate-700 dark:text-slate-200">Simon Pattern Memory</div>
        <div className="text-xs text-slate-400">Longest {best}</div>
      </div>
      <p className="text-xs text-slate-400 mb-3">Watch the pattern light up, then repeat it back. Each round adds one more step — a classic test of sequence recall.</p>
      <div className="grid grid-cols-2 gap-2 max-w-[220px] mx-auto mb-3">
        {PADS.map((p) => (
          <button key={p.id} onClick={() => press(p.id)} disabled={status !== "input"}
            className="aspect-square rounded-xl transition disabled:opacity-90"
            style={{ background: p.color, opacity: active === p.id ? 1 : 0.55, transform: active === p.id ? "scale(0.94)" : "scale(1)" }} />
        ))}
      </div>
      <div className="text-center text-xs text-slate-400 mb-3">
        {status === "idle" && "Press start to begin."}
        {status === "showing" && "Watch closely…"}
        {status === "input" && `Your turn — step ${userStep + 1} of ${sequence.length}`}
        {status === "over" && `Game over — sequence length ${sequence.length}.`}
      </div>
      <button onClick={start} disabled={status === "showing"} className="w-full text-xs py-1.5 rounded-lg text-white disabled:opacity-50" style={{ background: "var(--accent)" }}>
        {status === "idle" ? "Start" : "Restart"}
      </button>
    </div>
  );
}

/* ---- CS 5: Binary Search Game ---- */
function BinarySearchGame({ push }) {
  const N = 100;
  const [target, setTarget] = useState(() => Math.floor(Math.random() * N) + 1);
  const [lo, setLo] = useState(1);
  const [hi, setHi] = useState(N);
  const [guess, setGuess] = useState(Math.round((1 + N) / 2).toString());
  const [tries, setTries] = useState(0);
  const [history, setHistory] = useState([]);
  const [won, setWon] = useState(false);
  const [best, setBest] = useState(() => getBest("binarySearch", Infinity));
  const optimalTries = Math.ceil(Math.log2(N));

  const submit = () => {
    const g = Number(guess);
    if (!g || g < lo || g > hi) { push?.(`Guess must be between ${lo} and ${hi}.`, "error"); return; }
    setTries((t) => t + 1);
    if (g === target) {
      setWon(true);
      const nb = recordBest("binarySearch", tries + 1, false); setBest(nb);
      push?.(`Found it in ${tries + 1} guesses (optimal is ~${optimalTries}).`, "success");
      setHistory((h) => [...h, { g, hint: "correct" }]);
      return;
    }
    const hint = g < target ? "higher" : "lower";
    if (g < target) setLo(g + 1); else setHi(g - 1);
    setHistory((h) => [...h, { g, hint }]);
    setGuess(Math.round(((g < target ? g + 1 : lo) + (g < target ? hi : g - 1)) / 2).toString());
  };
  const reset = () => {
    setTarget(Math.floor(Math.random() * N) + 1); setLo(1); setHi(N);
    setGuess(Math.round((1 + N) / 2).toString()); setTries(0); setHistory([]); setWon(false);
  };

  return (
    <div className="rounded-2xl border border-slate-200 dark:border-slate-800 p-4">
      <div className="flex items-center justify-between mb-2">
        <div className="text-sm font-medium text-slate-700 dark:text-slate-200">Binary Search Game</div>
        <div className="text-xs text-slate-400">Best {best === Infinity ? "—" : best} · Optimal ~{optimalTries}</div>
      </div>
      <p className="text-xs text-slate-400 mb-3">I'm thinking of a number 1–{N}. Halve your search range each guess (like binary search: O(log n)) to find it in the fewest tries.</p>
      {!won ? (
        <>
          <div className="text-center text-xs text-slate-400 mb-2">Range: {lo} – {hi} · Tries: {tries}</div>
          <input value={guess} onChange={(e) => setGuess(e.target.value.replace(/[^0-9]/g, ""))} onKeyDown={(e) => e.key === "Enter" && submit()}
            inputMode="numeric" className="w-full text-center text-lg rounded-lg border border-slate-200 dark:border-slate-700 bg-transparent px-3 py-2 outline-none mb-2" />
          <button onClick={submit} className="w-full text-xs py-1.5 rounded-lg text-white mb-2" style={{ background: "var(--accent)" }}>Guess</button>
        </>
      ) : (
        <p className="text-center text-xs text-emerald-500 mb-2">Found {target} in {tries} guesses! 🎉</p>
      )}
      {history.length > 0 && (
        <div className="flex flex-wrap gap-1 justify-center mb-2">
          {history.map((h, i) => (
            <span key={i} className={`text-[10px] px-1.5 py-0.5 rounded-full ${h.hint === "correct" ? "bg-emerald-100 dark:bg-emerald-950/40 text-emerald-600" : "bg-slate-100 dark:bg-slate-800 text-slate-500"}`}>
              {h.g} {h.hint === "higher" ? "↑" : h.hint === "lower" ? "↓" : "✓"}
            </span>
          ))}
        </div>
      )}
      <button onClick={reset} className="w-full text-xs py-1.5 rounded-lg bg-slate-100 dark:bg-slate-800">New Number</button>
    </div>
  );
}
