function readSavedFirebaseConfig() {
  try {
    const raw = localStorage.getItem(FIREBASE_CONFIG_LS_KEY);
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    if (parsed && parsed.apiKey && parsed.projectId) return parsed;
    return null;
  } catch (e) {
    return null;
  }
}

if (FIREBASE_READY) {
  try {
    fbApp = firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
    storage = firebase.storage();
    auth = firebase.auth();
    // Explicit LOCAL persistence. On some mobile browsers (private/incognito
    // tabs, locked-down WebViews, some ad/tracker blockers) IndexedDB is
    // unavailable and Firebase Auth's default persistence setup can hang
    // silently, which is what made the app get stuck on "Connecting…"
    // forever. If LOCAL persistence fails we fall back to in-memory
    // persistence so auth can still resolve instead of hanging.
    auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(() => {
      auth.setPersistence(firebase.auth.Auth.Persistence.NONE).catch(() => {});
    });
  } catch (e) {
    console.error("Firebase init failed, falling back to local demo mode:", e);
    fbApp = null; db = null; storage = null; auth = null;
  }
}

const CITATION_STYLES = ["APA", "MLA", "IEEE", "Harvard"];
const CITATION_TYPES = ["Website", "Book", "Journal Article", "Report"];
function formatCitation(style, type, f) {
  const authors = f.authors?.trim() || "Author, A.";
  const year = f.year?.trim() || "n.d.";
  const title = f.title?.trim() || "Untitled";
  const source = f.source?.trim() || "";
  const url = f.url?.trim() || "";
  const publisher = f.publisher?.trim() || "";
  switch (style) {
    case "APA":
      return `${authors} (${year}). ${title}.${source ? ` ${source}.` : ""}${url ? ` ${url}` : ""}`;
    case "MLA":
      return `${authors}. "${title}."${source ? ` ${source},` : ""} ${year}${url ? `, ${url}` : ""}.`;
    case "IEEE":
      return `${authors}, "${title}," ${source || type}, ${year}.${url ? ` [Online]. Available: ${url}` : ""}`;
    case "Harvard":
      return `${authors} ${year}, '${title}'${source ? `, ${source}` : ""}${publisher ? `, ${publisher}` : ""}.`;
    default:
      return "";
  }
}

/* ------------------------- Feature: note encryption ------------------------ */
function xorCipher(text, key) {
  if (!key) return text;
  let out = "";
  for (let i = 0; i < text.length; i++) out += String.fromCharCode(text.charCodeAt(i) ^ key.charCodeAt(i % key.length));
  return out;
}
function encryptText(text, passphrase) {
  return btoa(unescape(encodeURIComponent(xorCipher(text, passphrase))));
}
function decryptText(cipherText, passphrase) {
  return xorCipher(decodeURIComponent(escape(atob(cipherText))), passphrase);
}

/* ---------------------------- Utilities --------------------------------- */
function formatBytes(bytes) {
  if (!bytes || bytes <= 0) return "0 KB";
  const mb = bytes / (1024 * 1024);
  if (mb < 1) return `${Math.max(1, Math.round(bytes / 1024))} KB`;
  if (mb < 1024) return `${mb.toFixed(1)} MB`;
  return `${(mb / 1024).toFixed(2)} GB`;
}

function extOf(name = "") {
  const parts = name.split(".");
  return parts.length > 1 ? parts.pop().toLowerCase() : "";
}

function categoryOf(ext) {
  if (["pdf"].includes(ext)) return "PDF";
  if (["png", "jpg", "jpeg", "gif", "webp", "svg"].includes(ext)) return "Image";
  if (["mp4", "webm", "mov", "mkv"].includes(ext)) return "Video";
  if (["mp3", "wav", "ogg", "m4a"].includes(ext)) return "Audio";
  if (["py", "js", "jsx", "ts", "tsx", "java", "c", "cpp", "html", "css", "json"].includes(ext)) return "Code";
  if (["md", "txt"].includes(ext)) return "Text";
  if (["csv", "tsv"].includes(ext)) return "Data";
  if (["docx"].includes(ext)) return "Docx";
  if (["xlsx", "xls"].includes(ext)) return "Sheet";
  return "Other";
}

async function sha256Hex(arrayBuffer) {
  try {
    const hashBuffer = await crypto.subtle.digest("SHA-256", arrayBuffer);
    return Array.from(new Uint8Array(hashBuffer))
      .map((b) => b.toString(16).padStart(2, "0"))
      .join("");
  } catch {
    // Fallback simulated hash if SubtleCrypto unavailable
    let h = 0;
    const view = new Uint8Array(arrayBuffer.slice(0, 4096));
    for (let i = 0; i < view.length; i++) h = (h * 31 + view[i]) >>> 0;
    return h.toString(16).padStart(64, "0");
  }
}

function estimateCompression(ext, size) {
  const cat = categoryOf(ext);
  const table = { PDF: 0.12, Image: 0.05, Audio: 0.03, Code: 0.42, Text: 0.55, Other: 0.15 };
  const ratio = table[cat] ?? 0.15;
  return Math.round(size * ratio);
}

function estimateReadingTime(content = "") {
  const words = content.trim().split(/\s+/).filter(Boolean).length;
  const minutes = Math.max(1, Math.round(words / 200));
  return { words, minutes };
}

function uid() {
  return (crypto.randomUUID && crypto.randomUUID()) || `id_${Date.now()}_${Math.random().toString(16).slice(2)}`;
}

function loadLS(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  } catch {
    return fallback;
  }
}
function saveLS(key, val) {
  try {
    localStorage.setItem(key, JSON.stringify(val));
  } catch {}
}

/* ------------------------- Persistent blob storage -------------------------
   Local Demo Mode previously handed out URL.createObjectURL() blob: links and
   saved that string straight into localStorage. Blob URLs only live as long
   as the page/tab that minted them — after any refresh they 404, which is
   why "Open Directly", downloads, and inline previews used to break. Real
   file bytes now live in IndexedDB (good for hundreds of MB — far beyond
   localStorage's ~5MB cap) and a fresh blob: URL is re-minted from IndexedDB
   every time the app loads, so links always work in the current session. */
const IDB_NAME = "scholarbox_blobs_v1";
const IDB_STORE = "blobs";
let _idbPromise = null;
function idbOpen() {
  if (_idbPromise) return _idbPromise;
  _idbPromise = new Promise((resolve, reject) => {
    if (!("indexedDB" in window)) { reject(new Error("IndexedDB unavailable")); return; }
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = () => { req.result.createObjectStore(IDB_STORE); };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
  return _idbPromise;
}
async function idbPutBlob(id, blob) {
  const db = await idbOpen();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(IDB_STORE, "readwrite");
    tx.objectStore(IDB_STORE).put(blob, id);
    tx.oncomplete = () => resolve(true);
    tx.onerror = () => reject(tx.error);
  });
}
async function idbGetBlob(id) {
  const db = await idbOpen();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(IDB_STORE, "readonly");
    const req = tx.objectStore(IDB_STORE).get(id);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => reject(req.error);
  });
}
async function idbDeleteBlob(id) {
  try {
    const db = await idbOpen();
    return new Promise((resolve) => {
      const tx = db.transaction(IDB_STORE, "readwrite");
      tx.objectStore(IDB_STORE).delete(id);
      tx.oncomplete = () => resolve(true);
      tx.onerror = () => resolve(false);
    });
  } catch { return false; }
}

/* ------------------------------ Clipboard ----------------------------------
   navigator.clipboard.writeText() silently rejects on insecure contexts
   (e.g. a file:// page opened straight from disk, which is exactly how this
   app is designed to run) and whenever clipboard permission is denied. This
   helper tries the modern API first, then falls back to a hidden, selected
   textarea + document.execCommand("copy"), which works in those contexts. */
async function robustCopyText(text) {
  if (navigator.clipboard && window.isSecureContext) {
    try { await navigator.clipboard.writeText(text); return true; } catch {}
  }
  try {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.position = "fixed";
    ta.style.top = "-9999px";
    ta.style.left = "-9999px";
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    ta.setSelectionRange(0, text.length);
    const ok = document.execCommand("copy");
    document.body.removeChild(ta);
    if (ok) return true;
  } catch {}
  try { await navigator.clipboard.writeText(text); return true; } catch {}
  return false;
}

function toCSV(files) {
  const headers = ["Name", "Folder", "Category", "Size (bytes)", "Tags", "Starred", "Uploaded"];
  const rows = files.map((f) => [
    f.name,
    f.folderId || "root",
    categoryOf(extOf(f.name)),
    f.size,
    (f.tags || []).join("|"),
    f.starred ? "yes" : "no",
    f.uploadedAt ? new Date(f.uploadedAt).toISOString() : "",
  ]);
  return [headers, ...rows]
    .map((r) => r.map((c) => `"${String(c).replace(/"/g, '""')}"`).join(","))
    .join("\n");
}

function downloadBlob(content, filename, type) {
  const blob = new Blob([content], { type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

/* ============================== Toasts =================================== */
function useToasts() {
  const [toasts, setToasts] = useState([]);
  const dismiss = useCallback((id) => setToasts((t) => t.filter((x) => x.id !== id)), []);
  const push = useCallback((message, tone = "default") => {
    const id = uid();
    setToasts((t) => [...t, { id, message, tone }]);
    // Error toasts now stay up much longer (and can be dismissed manually
    // below) instead of auto-vanishing after 7s — that was hiding the exact
    // reason an upload failed before anyone had a chance to read it.
    if (tone !== "error") {
      setTimeout(() => setToasts((t) => t.filter((x) => x.id !== id)), 2800);
    }
  }, []);
  return { toasts, push, dismiss };
}

function ToastStack({ toasts, dismiss }) {
  return (
    <div className="fixed bottom-4 right-4 z-[100] flex flex-col gap-2 pointer-events-none max-w-[calc(100%-2rem)]">

          key={t.id}

          ${t.tone === "error"

        >

}

// Firebase's password sign-in needs an email-shaped address, but we want people
// to just type a plain username — so we quietly map "vikram" -> "vikram@scholarbox.local"
// behind the scenes. Users never see or type this.
const USERNAME_EMAIL_DOMAIN = "scholarbox.local";
const USERNAME_PATTERN = /^[a-zA-Z0-9][a-zA-Z0-9_.-]{2,24}$/;

function usernameToFakeEmail(username) {
  return `${username.trim().toLowerCase()}@${USERNAME_EMAIL_DOMAIN}`;
}

function friendlyAuthError(e) {
  const code = e && e.code || "";
  if (code.includes("email-already-in-use")) return "That username is already taken — try logging in instead.";
  if (code.includes("weak-password")) return "Password should be at least 6 characters.";
  if (code.includes("invalid-email")) return "That username contains characters that aren't allowed.";
  if (code.includes("user-not-found") || code.includes("wrong-password") || code.includes("invalid-credential")) return "Incorrect username or password.";
  if (code.includes("too-many-requests")) return "Too many attempts — please wait a moment and try again.";
  if (code.includes("network-request-failed")) return "Network error — check your connection.";
  return e && e.message ? e.message : "Something went wrong. Please try again.";
}

function StorageMeter({ usedBytes }) {

function BreakdownChart({ files }) {
  const totals = useMemo(() => {
    const map = {};
    files.filter((f) => !f.trashed).forEach((f) => {
      const cat = categoryOf(extOf(f.name));
      map[cat] = (map[cat] || 0) + f.size;
    });
    return map;
  }, [files]);
  const max = Math.max(1, ...Object.values(totals));
  const cats = Object.keys(CATEGORY_COLORS);
  return (
    <div className="space-y-2">
      {cats.map((c) => {
        const val = totals[c] || 0;
        return (
          <div key={c} className="flex items-center gap-2 text-xs">
            <span className="w-14 text-slate-500 dark:text-slate-400">{c}</span>
            <div className="flex-1 h-2 rounded-full bg-slate-200 dark:bg-slate-800 overflow-hidden">
              <div
                className="h-full rounded-full transition-all duration-500"
                style={{ width: `${(val / max) * 100}%`, background: CATEGORY_COLORS[c] }}
              />
            </div>
            <span className="w-16 text-right text-slate-500 dark:text-slate-400">{formatBytes(val)}</span>
          </div>
        );
      })}
    </div>
  );
}

function PomodoroWidget({ push }) {
  const WORK = 25 * 60, BREAK = 5 * 60;
  const [seconds, setSeconds] = useState(WORK);
  const [running, setRunning] = useState(false);
  const [mode, setMode] = useState("work");
  const intervalRef = useRef(null);

  useEffect(() => {
    if (running) {
      intervalRef.current = setInterval(() => {
        setSeconds((s) => {
          if (s <= 1) {
            const nextMode = mode === "work" ? "break" : "work";
            setMode(nextMode);
            push(nextMode === "break" ? "Focus session complete — take a break!" : "Break's over — back to focus.", "success");
            return nextMode === "break" ? BREAK : WORK;
          }
          return s - 1;
        });
      }, 1000);
    }
    return () => clearInterval(intervalRef.current);
  }, [running, mode, push]);

  const mm = String(Math.floor(seconds / 60)).padStart(2, "0");
  const ss = String(seconds % 60).padStart(2, "0");

  return (
    <div className="rounded-2xl border border-slate-200 dark:border-slate-800 p-4 bg-white dark:bg-slate-900">
      <div className="flex items-center gap-2 mb-3 text-slate-700 dark:text-slate-200 font-medium text-sm">
        <Timer className="w-4 h-4" /> Pomodoro Focus Timer
      </div>
      <div className="text-center">
        <div className="text-3xl font-semibold tabular-nums text-slate-900 dark:text-white">{mm}:{ss}</div>
        <div className="text-xs uppercase tracking-wide text-slate-400 mt-0.5">{mode === "work" ? "Focus" : "Break"}</div>
      </div>
      <div className="flex items-center justify-center gap-2 mt-3">
        <button onClick={() => setRunning((r) => !r)} className="p-2 rounded-lg bg-indigo-500 text-white hover:bg-indigo-600 transition">
          {running ? <Pause className="w-4 h-4" /> : <Play className="w-4 h-4" />}
        </button>
        <button
          onClick={() => { setRunning(false); setMode("work"); setSeconds(WORK); }}
          className="p-2 rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 transition"
        >
          <RotateCcw className="w-4 h-4" />
        </button>
      </div>
    </div>
  );
}

function FormulaSheet({ copyToClipboard, push }) {
  const [subject, setSubject] = useState("All");
  const [query, setQuery] = useState("");
  const [showAdd, setShowAdd] = useState(false);
  const [custom, setCustom] = useState(() => loadLS(LS_KEYS.customFormulas, []));
  const [form, setForm] = useState({ subject: "Math", name: "", formula: "" });
  const fileRef = useRef(null);

  useEffect(() => saveLS(LS_KEYS.customFormulas, custom), [custom]);

  const allSubjects = useMemo(
    () => ["All", ...Array.from(new Set([...FORMULAS, ...custom].map((f) => f.subject)))],
    [custom]
  );

  const combined = useMemo(
    () => [...custom.map((f) => ({ ...f, mine: true })), ...FORMULAS],
    [custom]
  );

  const filtered = combined.filter((f) => {
    if (subject !== "All" && f.subject !== subject) return false;
    if (query.trim()) {
      const q = query.toLowerCase();
      if (!f.name.toLowerCase().includes(q) && !f.formula.toLowerCase().includes(q)) return false;
    }
    return true;
  });

  const addFormula = () => {
    if (!form.name.trim() || !form.formula.trim()) { push?.("Give the formula a name and an expression.", "error"); return; }
    setCustom((c) => [{ id: uid(), subject: form.subject.trim() || "Custom", name: form.name.trim(), formula: form.formula.trim() }, ...c]);
    setForm({ subject: form.subject, name: "", formula: "" });
    setShowAdd(false);
    push?.("Formula added to your reference sheet.", "success");
  };

  const removeFormula = (id) => setCustom((c) => c.filter((f) => f.id !== id));

  /* Upload a .txt/.csv/.json of formulas — one per line as "Subject | Name | Formula",
     or a JSON array of {subject,name,formula}. Lets students bulk-import a whole sheet. */
  const onUploadFile = async (e) => {
    const file = e.target.files?.[0];
    e.target.value = "";
    if (!file) return;
    try {
      const text = await file.text();
      let imported = [];
      if (file.name.toLowerCase().endsWith(".json")) {
        const parsed = JSON.parse(text);
        imported = (Array.isArray(parsed) ? parsed : []).map((f) => ({
          id: uid(), subject: f.subject || "Custom", name: f.name || "Untitled", formula: f.formula || "",
        })).filter((f) => f.formula);
      } else {
        imported = text.split(/\r?\n/).map((line) => line.trim()).filter(Boolean).map((line) => {
          const parts = line.split("|").map((p) => p.trim());
          if (parts.length >= 3) return { id: uid(), subject: parts[0], name: parts[1], formula: parts.slice(2).join("|") };
          if (parts.length === 2) return { id: uid(), subject: "Custom", name: parts[0], formula: parts[1] };
          return null;
        }).filter(Boolean);
      }
      if (!imported.length) { push?.("No formulas found in that file — use \"Subject | Name | Formula\" per line, or JSON.", "error"); return; }
      setCustom((c) => [...imported, ...c]);
      push?.(`Imported ${imported.length} formula${imported.length === 1 ? "" : "s"}.`, "success");
    } catch {
      push?.("Couldn't read that file.", "error");
    }
  };

  return (
    <div className="rounded-2xl border border-slate-200 dark:border-slate-800 p-4 bg-white dark:bg-slate-900">
      <div className="flex items-center justify-between mb-3 gap-2 flex-wrap">
        <div className="flex items-center gap-2 text-slate-700 dark:text-slate-200 font-medium text-sm">
          <BookOpen className="w-4 h-4" /> Formula Quick Reference
        </div>
        <div className="flex items-center gap-1.5">
          <button onClick={() => setShowAdd((s) => !s)} className="flex items-center gap-1 text-xs rounded-lg border border-slate-200 dark:border-slate-700 px-2 py-1 text-indigo-500">
            <Plus className="w-3.5 h-3.5" /> Add
          </button>
          <button onClick={() => fileRef.current?.click()} className="flex items-center gap-1 text-xs rounded-lg border border-slate-200 dark:border-slate-700 px-2 py-1 text-indigo-500" title="Upload a .txt (Subject | Name | Formula per line) or .json file">
            <Upload className="w-3.5 h-3.5" /> Upload
          </button>
          <input ref={fileRef} type="file" accept=".txt,.csv,.json" onChange={onUploadFile} className="hidden" />
        </div>
      </div>

      <div className="flex items-center gap-2 mb-3">
        <select value={subject} onChange={(e) => setSubject(e.target.value)} className="text-xs rounded-lg border border-slate-200 dark:border-slate-700 bg-transparent px-2 py-1">
          {allSubjects.map((s) => <option key={s}>{s}</option>)}
        </select>
        <input
          value={query} onChange={(e) => setQuery(e.target.value)} placeholder="Search formulas…"
          className="flex-1 text-xs rounded-lg border border-slate-200 dark:border-slate-700 bg-transparent px-2 py-1.5 outline-none"
        />
      </div>

      {showAdd && (
        <div className="mb-3 rounded-xl border border-dashed border-indigo-300 dark:border-indigo-700 p-3 space-y-2">
          <div className="flex gap-2">
            <input value={form.subject} onChange={(e) => setForm({ ...form, subject: e.target.value })} placeholder="Subject" className="w-1/3 text-xs rounded-lg border border-slate-200 dark:border-slate-700 bg-transparent px-2 py-1.5 outline-none" />
            <input value={form.name} onChange={(e) => setForm({ ...form, name: e.target.value })} placeholder="Formula name" className="flex-1 text-xs rounded-lg border border-slate-200 dark:border-slate-700 bg-transparent px-2 py-1.5 outline-none" />
          </div>
          <input value={form.formula} onChange={(e) => setForm({ ...form, formula: e.target.value })} placeholder="e.g. E = mc²" className="w-full text-xs font-mono rounded-lg border border-slate-200 dark:border-slate-700 bg-transparent px-2 py-1.5 outline-none" />
          <button onClick={addFormula} className="w-full text-xs py-1.5 rounded-lg text-white" style={{ background: "var(--accent)" }}>Save Formula</button>
        </div>
      )}

      <div className="space-y-2 max-h-52 overflow-y-auto">
        {filtered.length === 0 && <p className="text-xs text-slate-400 text-center py-4">No formulas match.</p>}
        {filtered.map((f) => (
          <div key={f.id || f.name} className="text-sm rounded-lg bg-slate-50 dark:bg-slate-800/60 px-3 py-2 flex items-start justify-between gap-2">
            <div className="min-w-0">
              <div className="text-xs text-slate-400 flex items-center gap-1.5">
                {f.subject}
                {f.mine && <span className="text-[10px] px-1.5 py-0.5 rounded-full bg-indigo-500/15 text-indigo-500">yours</span>}
              </div>
              <div className="font-medium text-slate-700 dark:text-slate-200 truncate">{f.name}</div>
              <div className="font-mono text-indigo-500 text-xs mt-0.5 break-all">{f.formula}</div>
            </div>
            <div className="flex items-center gap-1 shrink-0">
              <button onClick={() => copyToClipboard?.(f.formula, `Copied "${f.name}"`)} className="p-1.5 rounded-lg hover:bg-white dark:hover:bg-slate-900" title="Copy formula">
                <Copy className="w-3.5 h-3.5 text-slate-400" />
              </button>
              {f.mine && (
                <button onClick={() => removeFormula(f.id)} className="p-1.5 rounded-lg hover:bg-white dark:hover:bg-slate-900" title="Remove">
                  <Trash2 className="w-3.5 h-3.5 text-rose-400" />
                </button>
              )}
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

function ExamCountdown() {
  const [date, setDate] = useState(() => loadLS(LS_KEYS.examDate, ""));
  useEffect(() => saveLS(LS_KEYS.examDate, date), [date]);
  const remaining = useMemo(() => {
    if (!date) return null;
    const diff = new Date(date).getTime() - Date.now();
    if (diff <= 0) return { days: 0, hours: 0 };
    return { days: Math.floor(diff / 86400000), hours: Math.floor((diff % 86400000) / 3600000) };
  }, [date]);
  return (
    <div className="rounded-2xl border border-slate-200 dark:border-slate-800 p-4 bg-white dark:bg-slate-900">

function QuoteOfTheDay() {
  // Days-since-epoch (not day-of-month) so the quote changes exactly once
  // every calendar day, cycles through all 30 quotes in order, and then
  // repeats from the top — instead of resetting/skipping at month boundaries.
  const daysSinceEpoch = Math.floor(Date.now() / 86400000);
  const idx = daysSinceEpoch % QUOTES.length;
  return (
    <div className="rounded-2xl border border-indigo-200/60 dark:border-indigo-900/60 p-4 bg-gradient-to-br from-indigo-50 to-cyan-50 dark:from-indigo-950/40 dark:to-cyan-950/30">
      <div className="flex items-center gap-2 mb-2 text-indigo-600 dark:text-indigo-300 font-medium text-sm">
        <Sparkles className="w-4 h-4" /> Today's Motivation
      </div>
      <p className="text-sm text-slate-600 dark:text-slate-300 italic">"{QUOTES[idx]}"</p>
    </div>
  );
}

function SessionTimer({ unlockTime }) {
  const [now, setNow] = useState(Date.now());
  useEffect(() => {
    const t = setInterval(() => setNow(Date.now()), 1000);
    return () => clearInterval(t);
  }, []);
  const elapsed = Math.max(0, Math.floor((now - unlockTime) / 1000));
  const h = String(Math.floor(elapsed / 3600)).padStart(2, "0");
  const m = String(Math.floor((elapsed % 3600) / 60)).padStart(2, "0");
  const s = String(elapsed % 60).padStart(2, "0");
  return (
    <div className="flex items-center gap-1.5 text-xs text-slate-400 tabular-nums">
      <Clock className="w-3.5 h-3.5" /> {h}:{m}:{s} studying
    </div>
  );
}

  const [showIntegral, setShowIntegral] = useState(false);
  const [intF, setIntF] = useState("x^2");
  const [intA, setIntA] = useState("0");
  const [intB, setIntB] = useState("1");
  const [intN, setIntN] = useState("100");
  const [intResult, setIntResult] = useState(null);

  const press = (t) => setExpr((e) => e + t);
  const clearAll = () => { setExpr(""); setResult(""); };
  const backspace = () => setExpr((e) => e.slice(0, -1));

  const evaluate = () => {
    try {
      const toRad = (v) => (angleMode === "DEG" ? (v * Math.PI) / 180 : v);
      const SIN = (v) => Math.sin(toRad(v));
      const COS = (v) => Math.cos(toRad(v));
      const TAN = (v) => Math.tan(toRad(v));
      let e = expr
        .replace(/√/g, "SQRT")
        .replace(/π/g, "PI")
        .replace(/\^/g, "**")
        .replace(/sin/gi, "SIN")
        .replace(/cos/gi, "COS")
        .replace(/tan/gi, "TAN")
        .replace(/ln\(/gi, "LN(")
        .replace(/log\(/gi, "LOG(")
        .replace(/%/g, "/100");
      // eslint-disable-next-line no-new-func
      const fn = Function(
        "SIN", "COS", "TAN", "SQRT", "LOG", "LN", "PI", "E",
        `"use strict"; return (${e || 0});`
      );
      const val = fn(SIN, COS, TAN, Math.sqrt, Math.log10, Math.log, Math.PI, Math.E);
      setResult(Number.isFinite(val) ? String(Math.round(val * 1e10) / 1e10) : "Error");
    } catch { setResult("Error"); }
  };

  const runIntegration = () => {
    try {
      // eslint-disable-next-line no-new-func
      const f = Function("x", `"use strict"; return (${intF.replace(/\^/g, "**")});`);
      const a = Number(intA), b = Number(intB);
      let n = Math.max(2, Math.floor(Number(intN)));
      if (n % 2 !== 0) n += 1; // Simpson's rule requires even intervals
      const h = (b - a) / n;
      let sum = f(a) + f(b);
      for (let i = 1; i < n; i++) sum += f(a + i * h) * (i % 2 === 0 ? 2 : 4);
      setIntResult((h / 3) * sum);
    } catch { setIntResult(null); }
  };

  const keys = [
    "7", "8", "9", "/", "sin(",
    "4", "5", "6", "*", "cos(",
    "1", "2", "3", "-", "tan(",
    "0", ".", "(", ")", "+",
    "√(", "^", "log(", "ln(", "π",
  ];

  return (
    <div className="rounded-2xl border border-slate-200 dark:border-slate-800 p-4 bg-white dark:bg-slate-900">
      <div className="flex items-center justify-between mb-3">
        <div className="flex items-center gap-2 text-slate-700 dark:text-slate-200 font-medium text-sm">
          <Calculator className="w-4 h-4" /> Scientific Calculator
        </div>
        <button
          onClick={() => setAngleMode((m) => (m === "DEG" ? "RAD" : "DEG"))}
          className="text-[10px] font-semibold px-2 py-1 rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-500"
        >
          {angleMode}
        </button>
      </div>
      <input
        value={expr}
        onChange={(e) => setExpr(e.target.value)}
        onKeyDown={(e) => e.key === "Enter" && evaluate()}
        placeholder="sin(30) + √(9) * 2^3"
        className="w-full text-sm font-mono rounded-lg border border-slate-200 dark:border-slate-700 bg-transparent px-3 py-2 outline-none mb-2"
      />
      <div className="grid grid-cols-5 gap-1.5 mb-2">
        {keys.map((k) => (
          <button
            key={k}
            onClick={() => press(k)}
            className="text-xs py-2 rounded-lg bg-slate-50 dark:bg-slate-800/60 hover:bg-slate-100 dark:hover:bg-slate-800 font-mono"
          >
            {k}
          </button>
        ))}
      </div>
      <div className="flex gap-1.5">
        <button onClick={backspace} className="flex-1 text-xs py-2 rounded-lg bg-slate-100 dark:bg-slate-800">⌫</button>
        <button onClick={clearAll} className="flex-1 text-xs py-2 rounded-lg bg-rose-50 dark:bg-rose-950/40 text-rose-500">Clear</button>
        <button onClick={evaluate} className="flex-[2] text-xs py-2 rounded-lg text-white font-medium" style={{ background: "var(--accent)" }}>Evaluate =</button>
      </div>
      {result !== "" && (
        <div className="mt-2 text-center text-xl font-semibold text-slate-900 dark:text-white">{result}</div>
      )}

      <button onClick={() => setShowIntegral((s) => !s)} className="mt-3 text-xs text-indigo-500 hover:text-indigo-600 flex items-center gap-1">
        <Sparkles className="w-3.5 h-3.5" /> {showIntegral ? "Hide" : "Show"} integration approximator
      </button>
      {showIntegral && (
        <div className="mt-2 space-y-1.5 rounded-xl bg-slate-50 dark:bg-slate-800/60 p-3">
          <div className="flex items-center gap-1.5 text-xs">
            f(x) = <input value={intF} onChange={(e) => setIntF(e.target.value)} className="flex-1 rounded-lg border border-slate-200 dark:border-slate-700 bg-transparent px-2 py-1 font-mono outline-none" />
          </div>
          <div className="flex items-center gap-1.5 text-xs">
            <span>a=</span><input value={intA} onChange={(e) => setIntA(e.target.value)} className="w-14 rounded-lg border border-slate-200 dark:border-slate-700 bg-transparent px-2 py-1 outline-none" />
            <span>b=</span><input value={intB} onChange={(e) => setIntB(e.target.value)} className="w-14 rounded-lg border border-slate-200 dark:border-slate-700 bg-transparent px-2 py-1 outline-none" />
            <span>n=</span><input value={intN} onChange={(e) => setIntN(e.target.value)} className="w-16 rounded-lg border border-slate-200 dark:border-slate-700 bg-transparent px-2 py-1 outline-none" />
          </div>
          <button onClick={runIntegration} className="w-full text-xs py-1.5 rounded-lg bg-indigo-500 hover:bg-indigo-600 text-white">Approximate ∫ f(x) dx (Simpson's Rule)</button>
          {intResult !== null && <div className="text-center text-sm font-semibold">≈ {intResult.toFixed(6)}</div>}
        </div>
      )}
    </div>
  );
}

/* ---- 2. Full CRUD Task & Assignment Command Center ---- */
function TaskManager({ tasks, setTasks, push }) {
  const CATEGORIES = ["Assignment", "Exam", "Project", "Reading", "Other"];
  const PRIORITIES = ["High", "Medium", "Low"];
  const PRIORITY_COLOR = { High: "text-rose-500 bg-rose-50 dark:bg-rose-950/40", Medium: "text-amber-500 bg-amber-50 dark:bg-amber-950/40", Low: "text-emerald-500 bg-emerald-50 dark:bg-emerald-950/40" };

  const [form, setForm] = useState({ text: "", priority: "Medium", dueDate: "", category: "Assignment" });
  const [editingId, setEditingId] = useState(null);
  const [filterCategory, setFilterCategory] = useState("All");
  const [filterPriority, setFilterPriority] = useState("All");

  const resetForm = () => { setForm({ text: "", priority: "Medium", dueDate: "", category: "Assignment" }); setEditingId(null); };

  const addOrUpdate = () => {
    if (!form.text.trim()) return;
    if (editingId) {
      setTasks(tasks.map((t) => (t.id === editingId ? { ...t, ...form } : t)));
      push("Task updated.", "success");
    } else {
      setTasks([{ id: uid(), done: false, ...form }, ...tasks]);
      push("Task added.", "success");
    }
    resetForm();
  };
  const startEdit = (t) => { setEditingId(t.id); setForm({ text: t.text, priority: t.priority || "Medium", dueDate: t.dueDate || "", category: t.category || "Assignment" }); };
  const toggleDone = (id) => setTasks(tasks.map((t) => (t.id === id ? { ...t, done: !t.done } : t)));
  const removeTask = (id) => { setTasks(tasks.filter((t) => t.id !== id)); push("Task permanently removed.", "default"); };

  const filtered = tasks.filter((t) => (filterCategory === "All" || (t.category || "Other") === filterCategory) && (filterPriority === "All" || (t.priority || "Medium") === filterPriority));
  const doneCount = tasks.filter((t) => t.done).length;
  const pct = tasks.length ? Math.round((doneCount / tasks.length) * 100) : 0;

  return (
    <div className="rounded-2xl border border-slate-200 dark:border-slate-800 p-4 bg-white dark:bg-slate-900">
      <div className="flex items-center gap-2 mb-3 text-slate-700 dark:text-slate-200 font-medium text-sm">
        <ListChecks className="w-4 h-4" /> Task & Assignment Command Center
      </div>

      <div className="grid grid-cols-2 gap-1.5 mb-2">
        <input value={form.text} onChange={(e) => setForm({ ...form, text: e.target.value })} placeholder="Task description…" className="col-span-2 text-sm rounded-lg border border-slate-200 dark:border-slate-700 bg-transparent px-2.5 py-1.5 outline-none" />
        <select value={form.priority} onChange={(e) => setForm({ ...form, priority: e.target.value })} className="text-xs rounded-lg border border-slate-200 dark:border-slate-700 bg-transparent px-2 py-1.5">
          {PRIORITIES.map((p) => <option key={p}>{p}</option>)}
        </select>
        <select value={form.category} onChange={(e) => setForm({ ...form, category: e.target.value })} className="text-xs rounded-lg border border-slate-200 dark:border-slate-700 bg-transparent px-2 py-1.5">
          {CATEGORIES.map((c) => <option key={c}>{c}</option>)}
        </select>
        <input type="date" value={form.dueDate} onChange={(e) => setForm({ ...form, dueDate: e.target.value })} className="col-span-2 text-xs rounded-lg border border-slate-200 dark:border-slate-700 bg-transparent px-2 py-1.5" />
      </div>
      <div className="flex gap-1.5 mb-3">
        <button onClick={addOrUpdate} className="flex-1 text-xs py-1.5 rounded-lg text-white font-medium" style={{ background: "var(--accent)" }}>
          {editingId ? "Save Changes" : "Add Task"}
        </button>
        {editingId && <button onClick={resetForm} className="text-xs px-3 py-1.5 rounded-lg bg-slate-100 dark:bg-slate-800">Cancel</button>}
      </div>

      <div className="flex items-center gap-2 mb-2">
        <select value={filterCategory} onChange={(e) => setFilterCategory(e.target.value)} className="text-[10px] rounded-lg border border-slate-200 dark:border-slate-700 bg-transparent px-1.5 py-1">
          <option>All</option>{CATEGORIES.map((c) => <option key={c}>{c}</option>)}
        </select>
        <select value={filterPriority} onChange={(e) => setFilterPriority(e.target.value)} className="text-[10px] rounded-lg border border-slate-200 dark:border-slate-700 bg-transparent px-1.5 py-1">
          <option>All</option>{PRIORITIES.map((p) => <option key={p}>{p}</option>)}
        </select>
        <span className="ml-auto text-[10px] text-slate-400">{doneCount}/{tasks.length} done</span>
      </div>
      <div className="h-1.5 w-full rounded-full bg-slate-100 dark:bg-slate-800 mb-3 overflow-hidden">
        <div className="h-full rounded-full" style={{ width: `${pct}%`, background: "var(--accent)" }} />
      </div>

      <div className="space-y-1.5 max-h-64 overflow-y-auto">
        {filtered.length === 0 && <p className="text-xs text-slate-400">No tasks match this filter.</p>}
        {filtered.map((t) => (
          <div key={t.id} className="flex items-start gap-2 text-sm group rounded-lg px-1.5 py-1 hover:bg-slate-50 dark:hover:bg-slate-800/50">
            <button onClick={() => toggleDone(t.id)} className="mt-0.5">
              {t.done ? <CheckSquare className="w-4 h-4 text-emerald-500" /> : <Square className="w-4 h-4 text-slate-400" />}
            </button>
            <div className="flex-1 min-w-0">
              <div className={`${t.done ? "line-through text-slate-400" : "text-slate-700 dark:text-slate-200"}`}>{t.text}</div>
              <div className="flex items-center gap-1.5 mt-0.5">
                <span className={`text-[9px] font-semibold px-1.5 py-0.5 rounded-full ${PRIORITY_COLOR[t.priority || "Medium"]}`}>{t.priority || "Medium"}</span>
                <span className="text-[9px] text-slate-400">{t.category || "Other"}</span>
                {t.dueDate && <span className="text-[9px] text-slate-400">due {t.dueDate}</span>}
              </div>
            </div>
            <button onClick={() => startEdit(t)} className="opacity-0 group-hover:opacity-100 text-slate-400 hover:text-indigo-500"><Edit3 className="w-3.5 h-3.5" /></button>
            <button onClick={() => removeTask(t.id)} className="opacity-0 group-hover:opacity-100 text-slate-400 hover:text-rose-500" title="Permanently delete"><Trash2 className="w-3.5 h-3.5" /></button>
          </div>
        ))}
      </div>
    </div>
  );
}

/* ---- 3. Eisenhower Priority Matrix ---- */
function EisenhowerMatrix({ push }) {
  const [items, setItems] = useState(() => loadLS(LS_KEYS.eisenhower, []));
  useEffect(() => saveLS(LS_KEYS.eisenhower, items), [items]);
  const [text, setText] = useState("");

  const addTo = (urgent, important) => {
    if (!text.trim()) return;
    setItems([...items, { id: uid(), text: text.trim(), urgent, important }]);
    setText("");
    push("Added to matrix.", "success");
  };
  const remove = (id) => setItems(items.filter((i) => i.id !== id));
  const quad = (u, i) => items.filter((x) => x.urgent === u && x.important === i);

  const Quad = ({ title, tone, u, i }) => (
    <div className={`rounded-xl border p-2.5 ${tone}`}>
      <div className="text-[10px] font-semibold mb-1.5 uppercase tracking-wide opacity-70">{title}</div>
      <div className="space-y-1">

          <div key={it.id} className="flex items-center justify-between text-xs bg-white/60 dark:bg-black/20 rounded-lg px-1.5 py-1">

            <button onClick={() => remove(it.id)} className="opacity-60 hover:opacity-100"><X className="w-3 h-3" /></button>

        {quad(u, i).length === 0 && <p className="text-[10px] opacity-50">Empty</p>}

      <button onClick={() => addTo(u, i)} className="mt-1.5 w-full text-[10px] py-1 rounded-lg bg-white/70 dark:bg-black/30 hover:opacity-80">+ Add here</button>

  return (
    <div className="rounded-2xl border border-slate-200 dark:border-slate-800 p-4 bg-white dark:bg-slate-900">
      <div className="flex items-center gap-2 mb-3 text-slate-700 dark:text-slate-200 font-medium text-sm">

      />
      <div className="grid grid-cols-2 gap-2">

        <Quad title="Important, Not Urgent — Schedule" tone="bg-amber-50 dark:bg-amber-950/30 border-amber-200 dark:border-amber-900" u={false} i={true} />
        <Quad title="Urgent, Not Important — Delegate" tone="bg-sky-50 dark:bg-sky-950/30 border-sky-200 dark:border-sky-900" u={true} i={false} />
        <Quad title="Neither — Eliminate" tone="bg-slate-50 dark:bg-slate-800/40 border-slate-200 dark:border-slate-700" u={false} i={false} />
      </div>
    </div>
  );
}

/* ---- 4. Dual-mode Multi-Semester GPA / CGPA Analytics ---- */
const GRADE_POINTS = { "A+": 4.3, A: 4.0, "A-": 3.7, "B+": 3.3, B: 3.0, "B-": 2.7, "C+": 2.3, C: 2.0, "C-": 1.7, D: 1.0, F: 0 };
function AcademicAnalytics({ push }) {
  const [semesters, setSemesters] = useState(() => loadLS(LS_KEYS.semesters, []));
  useEffect(() => saveLS(LS_KEYS.semesters, semesters), [semesters]);
  const [activeSemId, setActiveSemId] = useState(null);
  const [semName, setSemName] = useState("");

  const activeSem = semesters.find((s) => s.id === activeSemId);

  const addSemester = (mode) => {
    if (!semName.trim()) { push && push("Type a semester name first, e.g. \"Fall 2026\".", "error"); return; }
    const s = { id: uid(), name: semName.trim(), mode, rows: [] };
    setSemesters([...semesters, s]);
    setSemName("");
    setActiveSemId(s.id);
    push && push(`"${s.name}" added (${mode === "gpa" ? "grade-scale" : "marks-based"}).`, "success");
  };
  const removeSemester = (id) => { setSemesters(semesters.filter((s) => s.id !== id)); if (activeSemId === id) setActiveSemId(null); };

  const addRow = () => {
    if (!activeSem) return;
    const row = activeSem.mode === "gpa" ? { id: uid(), name: "Course", grade: "A", credits: 3 } : { id: uid(), name: "Course", obtained: 80, total: 100 };
    setSemesters(semesters.map((s) => (s.id === activeSemId ? { ...s, rows: [...s.rows, row] } : s)));
  };
  const updateRow = (rid, patch) => setSemesters(semesters.map((s) => (s.id === activeSemId ? { ...s, rows: s.rows.map((r) => (r.id === rid ? { ...r, ...patch } : r)) } : s)));
  const removeRow = (rid) => setSemesters(semesters.map((s) => (s.id === activeSemId ? { ...s, rows: s.rows.filter((r) => r.id !== rid) } : s)));

  const semResult = (s) => {
    if (s.mode === "gpa") {
      let pts = 0, credits = 0;
      s.rows.forEach((r) => { const c = Number(r.credits) || 0; pts += (GRADE_POINTS[r.grade] ?? 0) * c; credits += c; });
      return { label: "GPA", value: credits ? (pts / credits).toFixed(2) : "0.00", credits };
    }
    let obtained = 0, total = 0;
    s.rows.forEach((r) => { obtained += Number(r.obtained) || 0; total += Number(r.total) || 0; });
    return { label: "%", value: total ? ((obtained / total) * 100).toFixed(1) : "0.0", credits: total ? total / 100 : 0 };
  };

  const cgpa = useMemo(() => {
    const gpaSemesters = semesters.filter((s) => s.mode === "gpa" && s.rows.length);
    if (!gpaSemesters.length) return null;
    let pts = 0, credits = 0;
    gpaSemesters.forEach((s) => {
      s.rows.forEach((r) => { const c = Number(r.credits) || 0; pts += (GRADE_POINTS[r.grade] ?? 0) * c; credits += c; });
    });
    return credits ? (pts / credits).toFixed(2) : null;
  }, [semesters]);

  return (
    <div className="rounded-2xl border border-slate-200 dark:border-slate-800 p-4 bg-white dark:bg-slate-900">
      <div className="flex items-center gap-2 mb-3 text-slate-700 dark:text-slate-200 font-medium text-sm">
        <GraduationCap className="w-4 h-4" /> Multi-Semester GPA / CGPA Analytics
      </div>

      {cgpa && (
        <div className="mb-3 text-center rounded-xl bg-slate-50 dark:bg-slate-800/60 py-2">
          <span className="text-2xl font-semibold text-slate-900 dark:text-white">{cgpa}</span>
          <span className="text-xs text-slate-400 ml-1">Cumulative CGPA</span>
        </div>
      )}

      <div className="flex gap-1.5 mb-3">
        <input value={semName} onChange={(e) => setSemName(e.target.value)} placeholder="e.g. Fall 2026" className="flex-1 text-sm rounded-lg border border-slate-200 dark:border-slate-700 bg-transparent px-2.5 py-1.5 outline-none" />
        <button onClick={() => addSemester("gpa")} className="text-xs px-2.5 py-1.5 rounded-lg bg-indigo-500 hover:bg-indigo-600 text-white">+ Grade-scale</button>
        <button onClick={() => addSemester("marks")} className="text-xs px-2.5 py-1.5 rounded-lg bg-slate-100 dark:bg-slate-800">+ Marks-based</button>
      </div>

      <div className="flex flex-wrap gap-1.5 mb-3">
        {semesters.map((s) => (
          <button key={s.id} onClick={() => setActiveSemId(s.id)} className={`text-xs px-2.5 py-1 rounded-full border ${activeSemId === s.id ? "border-indigo-400 text-indigo-500 bg-indigo-50 dark:bg-indigo-950/30" : "border-slate-200 dark:border-slate-700 text-slate-500"}`}>
            {s.name} · {semResult(s).value}{s.mode === "marks" ? "%" : ""}
          </button>
        ))}
      </div>

      {activeSem && (
        <div className="rounded-xl bg-slate-50 dark:bg-slate-800/60 p-3">
          <div className="flex items-center justify-between mb-2">
            <span className="text-xs font-medium">{activeSem.name} ({activeSem.mode === "gpa" ? "Grade-point scale" : "Marks-based"})</span>
            <button onClick={() => removeSemester(activeSem.id)} className="text-rose-500 text-xs">Delete semester</button>
          </div>
          <div className="space-y-1.5 max-h-40 overflow-y-auto">
            {activeSem.rows.map((r) => (
              <div key={r.id} className="flex items-center gap-1.5">
                <input value={r.name} onChange={(e) => updateRow(r.id, { name: e.target.value })} className="flex-1 text-xs rounded-lg border border-slate-200 dark:border-slate-700 bg-transparent px-2 py-1 outline-none" />
                {activeSem.mode === "gpa" ? (
                  <>
                    <select value={r.grade} onChange={(e) => updateRow(r.id, { grade: e.target.value })} className="text-xs rounded-lg border border-slate-200 dark:border-slate-700 bg-transparent px-1.5 py-1">
                      {Object.keys(GRADE_POINTS).map((g) => <option key={g}>{g}</option>)}
                    </select>
                    <input type="number" value={r.credits} onChange={(e) => updateRow(r.id, { credits: e.target.value })} className="w-14 text-xs rounded-lg border border-slate-200 dark:border-slate-700 bg-transparent px-1.5 py-1 outline-none" />
                  </>
                ) : (
                  <>
                    <input type="number" value={r.obtained} onChange={(e) => updateRow(r.id, { obtained: e.target.value })} className="w-16 text-xs rounded-lg border border-slate-200 dark:border-slate-700 bg-transparent px-1.5 py-1 outline-none" placeholder="obtained" />
                    <span className="text-[10px] text-slate-400">/</span>
                    <input type="number" value={r.total} onChange={(e) => updateRow(r.id, { total: e.target.value })} className="w-16 text-xs rounded-lg border border-slate-200 dark:border-slate-700 bg-transparent px-1.5 py-1 outline-none" placeholder="max" />
                  </>
                )}
                <button onClick={() => removeRow(r.id)} className="text-slate-400 hover:text-rose-500"><X className="w-3.5 h-3.5" /></button>
              </div>
            ))}
          </div>
          <button onClick={addRow} className="mt-2 text-xs text-indigo-500 flex items-center gap-1"><Plus className="w-3.5 h-3.5" /> Add course</button>
          <div className="mt-2 pt-2 border-t border-slate-200 dark:border-slate-700 text-center text-sm font-semibold">
            {semResult(activeSem).label}: {semResult(activeSem).value}{activeSem.mode === "marks" ? "%" : ""}
          </div>
        </div>
      )}
    </div>
  );
}

/* ---- 5. Multi-semester Transcript Archiver ---- */
function TranscriptArchiver() {
  const [semesters] = useState(() => loadLS(LS_KEYS.semesters, []));
  const exportTranscript = () => {
    const lines = ["ScholarBox Academic Transcript", `Generated ${new Date().toLocaleString()}`, ""];
    semesters.forEach((s) => {
      lines.push(`${s.name} (${s.mode === "gpa" ? "Grade-point" : "Marks-based"})`);
      s.rows.forEach((r) => {
        lines.push(s.mode === "gpa" ? `  - ${r.name}: ${r.grade} (${r.credits} credits)` : `  - ${r.name}: ${r.obtained}/${r.total}`);
      });
      lines.push("");
    });
    downloadBlob(lines.join("\n"), "scholarbox-transcript.txt", "text/plain");

  return (
    <div className="rounded-2xl border border-slate-200 dark:border-slate-800 p-4 bg-white dark:bg-slate-900">
      <div className="flex items-center justify-between mb-3">
        <div className="flex items-center gap-2 text-slate-700 dark:text-slate-200 font-medium text-sm"><BookMarked className="w-4 h-4" /> Transcript Archive</div>
        <button onClick={exportTranscript} className="text-indigo-500 hover:text-indigo-600" title="Export transcript"><Download className="w-3.5 h-3.5" /></button>

            <div key={s.id} className="rounded-lg bg-slate-50 dark:bg-slate-800/60 px-2.5 py-1.5">

  );
}

/* ---- 6. Flashcard Deck with Spaced Repetition + Flip Animation ---- */
function FlashcardDeck({ push }) {
  const [decks, setDecks] = useState(() => loadLS(LS_KEYS.flashcards, []));
  useEffect(() => saveLS(LS_KEYS.flashcards, decks), [decks]);
  const [activeDeckId, setActiveDeckId] = useState(null);
  const [newDeckName, setNewDeckName] = useState("");
  const [front, setFront] = useState(""); const [back, setBack] = useState("");
  const [pos, setPos] = useState(0);
  const [flipped, setFlipped] = useState(false);

  const activeDeck = decks.find((d) => d.id === activeDeckId);
  const intervals = [0, 1, 3, 7, 14, 30]; // Leitner-style days per box level

  const addDeck = () => {
    if (!newDeckName.trim()) return;
    const d = { id: uid(), name: newDeckName.trim(), cards: [] };
    setDecks([...decks, d]); setNewDeckName(""); setActiveDeckId(d.id);
  };
  const removeDeck = (id) => { setDecks(decks.filter((d) => d.id !== id)); if (activeDeckId === id) setActiveDeckId(null); };
  const addCard = () => {
    if (!front.trim() || !back.trim() || !activeDeck) return;
    setDecks(decks.map((d) => (d.id === activeDeckId ? { ...d, cards: [...d.cards, { id: uid(), front, back, level: 0, nextReview: Date.now() }] } : d)));
    setFront(""); setBack("");
  };

  const due = activeDeck ? activeDeck.cards.filter((c) => (c.nextReview || 0) <= Date.now()) : [];
  const current = due.length ? due[pos % due.length] : null;

  const grade = (known) => {
    if (!current) return;
    const level = known ? Math.min((current.level || 0) + 1, intervals.length - 1) : 0;
    const nextReview = Date.now() + intervals[level] * 86400000;
    setDecks(decks.map((d) => (d.id === activeDeckId ? { ...d, cards: d.cards.map((c) => (c.id === current.id ? { ...c, level, nextReview } : c)) } : d)));
    setFlipped(false);
    push(known ? `Great — next review in ${intervals[level]} day(s).` : "No worries — back in the queue for today.", "success");
  };

  return (
    <div className="rounded-2xl border border-slate-200 dark:border-slate-800 p-4 bg-white dark:bg-slate-900">
      <div className="flex items-center gap-2 mb-3 text-slate-700 dark:text-slate-200 font-medium text-sm"><Layers className="w-4 h-4" /> Flashcard Decks (Spaced Repetition)</div>
      <div className="flex gap-1.5 mb-2">
        <input value={newDeckName} onChange={(e) => setNewDeckName(e.target.value)} placeholder="New deck name…" className="flex-1 text-sm rounded-lg border border-slate-200 dark:border-slate-700 bg-transparent px-2.5 py-1.5 outline-none" />
        <button onClick={addDeck} className="text-xs px-3 py-1.5 rounded-lg bg-indigo-500 hover:bg-indigo-600 text-white">Create</button>
      </div>
      <div className="flex flex-wrap gap-1.5 mb-3">
        {decks.map((d) => (
          <button key={d.id} onClick={() => { setActiveDeckId(d.id); setPos(0); setFlipped(false); }} className={`text-xs px-2.5 py-1 rounded-full border flex items-center gap-1 ${activeDeckId === d.id ? "border-indigo-400 text-indigo-500 bg-indigo-50 dark:bg-indigo-950/30" : "border-slate-200 dark:border-slate-700 text-slate-500"}`}>
            {d.name} ({d.cards.length})
            <X className="w-3 h-3 opacity-50 hover:opacity-100" onClick={(e) => { e.stopPropagation(); removeDeck(d.id); }} />
          </button>
        ))}
      </div>

      {activeDeck && (
        <>
          <div className="flex gap-1.5 mb-3">
            <input value={front} onChange={(e) => setFront(e.target.value)} placeholder="Front (question)" className="flex-1 text-xs rounded-lg border border-slate-200 dark:border-slate-700 bg-transparent px-2 py-1.5 outline-none" />
            <input value={back} onChange={(e) => setBack(e.target.value)} placeholder="Back (answer)" className="flex-1 text-xs rounded-lg border border-slate-200 dark:border-slate-700 bg-transparent px-2 py-1.5 outline-none" />
            <button onClick={addCard} className="text-xs px-2.5 py-1.5 rounded-lg bg-slate-100 dark:bg-slate-800"><Plus className="w-3.5 h-3.5" /></button>
          </div>

          {current ? (
            <div>
              <div
                onClick={() => setFlipped((f) => !f)}
                className="cursor-pointer select-none rounded-2xl border border-slate-200 dark:border-slate-700 h-32 flex items-center justify-center text-center p-4 transition-transform duration-300"
                style={{ transform: flipped ? "rotateY(180deg)" : "rotateY(0deg)", background: flipped ? "var(--accent)" : "" }}
              >
                <span className={`text-sm font-medium ${flipped ? "text-white" : "text-slate-700 dark:text-slate-200"}`} style={{ transform: flipped ? "rotateY(180deg)" : "none" }}>
                  {flipped ? current.back : current.front}
                </span>
              </div>
              <p className="text-center text-[10px] text-slate-400 mt-1">{due.length} card(s) due · tap card to flip</p>
              <div className="flex gap-1.5 mt-2">
                <button onClick={() => grade(false)} className="flex-1 text-xs py-1.5 rounded-lg bg-rose-50 dark:bg-rose-950/40 text-rose-500">Still learning</button>
                <button onClick={() => grade(true)} className="flex-1 text-xs py-1.5 rounded-lg bg-emerald-50 dark:bg-emerald-950/40 text-emerald-500">I knew it</button>
              </div>
            </div>
          ) : (
            <p className="text-xs text-slate-400 text-center py-4">Nothing due for review — add cards or check back later.</p>
          )}
        </>
      )}
    </div>
  );
}

/* ---- 7. Quiz Builder & Self-Assessment Engine ---- */
function QuizBuilder({ push }) {
  const [quizzes, setQuizzes] = useState(() => loadLS(LS_KEYS.quizzes, []));
  useEffect(() => saveLS(LS_KEYS.quizzes, quizzes), [quizzes]);
  const [quizName, setQuizName] = useState("");
  const [activeQuizId, setActiveQuizId] = useState(null);
  const [qForm, setQForm] = useState({ question: "", options: ["", "", "", ""], correct: 0 });
  const [taking, setTaking] = useState(null);
  const [score, setScore] = useState(null);

  const activeQuiz = quizzes.find((q) => q.id === activeQuizId);

  const addQuiz = () => { if (!quizName.trim()) return; const q = { id: uid(), name: quizName.trim(), questions: [] }; setQuizzes([...quizzes, q]); setQuizName(""); setActiveQuizId(q.id); };
  const removeQuiz = (id) => { setQuizzes(quizzes.filter((q) => q.id !== id)); if (activeQuizId === id) setActiveQuizId(null); };
  const addQuestion = () => {
    if (!qForm.question.trim() || qForm.options.some((o) => !o.trim())) return;
    setQuizzes(quizzes.map((q) => (q.id === activeQuizId ? { ...q, questions: [...q.questions, { id: uid(), ...qForm }] } : q)));
    setQForm({ question: "", options: ["", "", "", ""], correct: 0 });
  };

  const startTake = () => { setTaking({ idx: 0, answers: Array(activeQuiz.questions.length).fill(null) }); setScore(null); };
  const answer = (i) => setTaking((t) => { const a = [...t.answers]; a[t.idx] = i; return { ...t, answers: a }; });
  const finish = (finalTaking) => {
    let s = 0;
    activeQuiz.questions.forEach((q, i) => { if (finalTaking.answers[i] === q.correct) s++; });
    setScore(s); setTaking(null);
    push(`Quiz complete — ${s}/${activeQuiz.questions.length} correct.`, "success");
  };
  const next = () => {
    if (taking.idx < activeQuiz.questions.length - 1) setTaking({ ...taking, idx: taking.idx + 1 });
    else finish(taking);
  };

  return (
    <div className="rounded-2xl border border-slate-200 dark:border-slate-800 p-4 bg-white dark:bg-slate-900">
      <div className="flex items-center gap-2 mb-3 text-slate-700 dark:text-slate-200 font-medium text-sm"><ClipboardList className="w-4 h-4" /> Quiz Builder & Self-Assessment</div>
      <div className="flex gap-1.5 mb-2">
        <input value={quizName} onChange={(e) => setQuizName(e.target.value)} placeholder="New quiz name…" className="flex-1 text-sm rounded-lg border border-slate-200 dark:border-slate-700 bg-transparent px-2.5 py-1.5 outline-none" />
        <button onClick={addQuiz} className="text-xs px-3 py-1.5 rounded-lg bg-indigo-500 hover:bg-indigo-600 text-white">Create</button>
      </div>
      <div className="flex flex-wrap gap-1.5 mb-3">
        {quizzes.map((q) => (
          <button key={q.id} onClick={() => { setActiveQuizId(q.id); setTaking(null); setScore(null); }} className={`text-xs px-2.5 py-1 rounded-full border flex items-center gap-1 ${activeQuizId === q.id ? "border-indigo-400 text-indigo-500 bg-indigo-50 dark:bg-indigo-950/30" : "border-slate-200 dark:border-slate-700 text-slate-500"}`}>
            {q.name} ({q.questions.length}) <X className="w-3 h-3 opacity-50 hover:opacity-100" onClick={(e) => { e.stopPropagation(); removeQuiz(q.id); }} />
          </button>
        ))}
      </div>

      {activeQuiz && !taking && (
        <div className="rounded-xl bg-slate-50 dark:bg-slate-800/60 p-3 space-y-2">
          <input value={qForm.question} onChange={(e) => setQForm({ ...qForm, question: e.target.value })} placeholder="Question" className="w-full text-xs rounded-lg border border-slate-200 dark:border-slate-700 bg-transparent px-2 py-1.5 outline-none" />
          {qForm.options.map((o, i) => (
            <div key={i} className="flex items-center gap-1.5">
              <input type="radio" checked={qForm.correct === i} onChange={() => setQForm({ ...qForm, correct: i })} />
              <input value={o} onChange={(e) => { const opts = [...qForm.options]; opts[i] = e.target.value; setQForm({ ...qForm, options: opts }); }} placeholder={`Option ${i + 1}`} className="flex-1 text-xs rounded-lg border border-slate-200 dark:border-slate-700 bg-transparent px-2 py-1 outline-none" />
            </div>
          ))}
          <button onClick={addQuestion} className="text-xs text-indigo-500 flex items-center gap-1"><Plus className="w-3.5 h-3.5" /> Add question</button>
          {activeQuiz.questions.length > 0 && <button onClick={startTake} className="w-full text-xs py-1.5 rounded-lg text-white font-medium mt-1" style={{ background: "var(--accent)" }}>Take Quiz ({activeQuiz.questions.length} questions)</button>}
          {score !== null && <p className="text-center text-sm font-semibold">Last score: {score}/{activeQuiz.questions.length}</p>}
        </div>
      )}

      {activeQuiz && taking && (
        <div className="rounded-xl bg-slate-50 dark:bg-slate-800/60 p-3">
          <p className="text-xs text-slate-400 mb-1.5">Question {taking.idx + 1} of {activeQuiz.questions.length}</p>
          <p className="text-sm font-medium mb-2">{activeQuiz.questions[taking.idx].question}</p>
          <div className="space-y-1.5">
            {activeQuiz.questions[taking.idx].options.map((o, i) => (
              <button key={i} onClick={() => answer(i)} className={`w-full text-left text-xs px-2.5 py-1.5 rounded-lg border ${taking.answers[taking.idx] === i ? "border-indigo-400 bg-indigo-50 dark:bg-indigo-950/30" : "border-slate-200 dark:border-slate-700"}`}>{o}</button>
            ))}
          </div>
          <button onClick={next} disabled={taking.answers[taking.idx] === null} className="mt-2 w-full text-xs py-1.5 rounded-lg text-white disabled:opacity-40" style={{ background: "var(--accent)" }}>
            {taking.idx < activeQuiz.questions.length - 1 ? "Next" : "Finish Quiz"}
          </button>
        </div>
      )}
    </div>
  );
}

/* ---- 11. PDF Merge & Split Previewer ---- */
function PDFTools({ push }) {
  const [mergeFiles, setMergeFiles] = useState([]);
  const [splitFile, setSplitFile] = useState(null);
  const [busy, setBusy] = useState(false);

  const doMerge = async () => {
    if (!window.PDFLib) { push("PDF engine unavailable offline.", "error"); return; }
    if (mergeFiles.length < 2) { push("Select at least 2 PDFs to merge.", "error"); return; }
    setBusy(true);
    try {
      const merged = await PDFLib.PDFDocument.create();
      for (const file of mergeFiles) {
        const bytes = await file.arrayBuffer();
        const doc = await PDFLib.PDFDocument.load(bytes);
        const pages = await merged.copyPages(doc, doc.getPageIndices());
        pages.forEach((p) => merged.addPage(p));
      }
      const out = await merged.save();
      downloadBlob(out, "scholarbox-merged.pdf", "application/pdf");
      push("PDFs merged and downloaded.", "success");
    } catch { push("Merge failed — ensure valid, unencrypted PDFs.", "error"); }
    setBusy(false);
  };

  const doSplit = async () => {
    if (!window.PDFLib) { push("PDF engine unavailable offline.", "error"); return; }
    if (!splitFile) { push("Choose a PDF to split.", "error"); return; }
    setBusy(true);
    try {
      const bytes = await splitFile.arrayBuffer();
      const doc = await PDFLib.PDFDocument.load(bytes);
      const count = doc.getPageCount();
      for (let i = 0; i < count; i++) {
        const sub = await PDFLib.PDFDocument.create();
        const [page] = await sub.copyPages(doc, [i]);
        sub.addPage(page);
        const out = await sub.save();
        downloadBlob(out, `scholarbox-page-${i + 1}.pdf`, "application/pdf");
      }
      push(`Split into ${count} single-page file(s).`, "success");
    } catch { push("Split failed — ensure a valid, unencrypted PDF.", "error"); }
    setBusy(false);
  };

  return (
    <div className="rounded-2xl border border-slate-200 dark:border-slate-800 p-4 bg-white dark:bg-slate-900">
      <div className="flex items-center gap-2 mb-3 text-slate-700 dark:text-slate-200 font-medium text-sm"><FileText className="w-4 h-4" /> PDF Merge & Split</div>
      <div className="mb-3">
        <label className="text-xs text-slate-500 block mb-1">Merge PDFs (select multiple)</label>
        <input type="file" accept="application/pdf" multiple onChange={(e) => setMergeFiles(Array.from(e.target.files || []))} className="text-xs w-full" />
        <button onClick={doMerge} disabled={busy} className="mt-1.5 w-full text-xs py-1.5 rounded-lg text-white disabled:opacity-50" style={{ background: "var(--accent)" }}>Merge & Download</button>
      </div>
      <div>
        <label className="text-xs text-slate-500 block mb-1">Split a PDF into single pages</label>
        <input type="file" accept="application/pdf" onChange={(e) => setSplitFile(e.target.files?.[0] || null)} className="text-xs w-full" />
        <button onClick={doSplit} disabled={busy} className="mt-1.5 w-full text-xs py-1.5 rounded-lg bg-slate-100 dark:bg-slate-800 disabled:opacity-50">Split & Download Pages</button>
      </div>
    </div>
  );
}

/* ---- 12. Export-to-PDF Study Summary Generator ---- */
function ExportSummary({ files, tasks, push }) {
  const generate = () => {
    try {
      if (!window.jspdf) { push("PDF export engine unavailable offline.", "error"); return; }
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();
      doc.setFontSize(16); doc.text("ScholarBox Study Summary", 14, 18);
      doc.setFontSize(10); doc.text(`Generated ${new Date().toLocaleString()}`, 14, 25);
      doc.setFontSize(12);
      doc.text(`Files stored: ${files.filter((f) => !f.trashed).length}`, 14, 36);
      doc.text(`Tasks: ${tasks.length} total, ${tasks.filter((t) => t.done).length} completed`, 14, 43);
      let y = 55;
      doc.setFontSize(13); doc.text("Open Tasks", 14, y); y += 7;
      doc.setFontSize(10);
      const open = tasks.filter((t) => !t.done);
      if (open.length === 0) doc.text("All caught up — nothing pending.", 14, y);
      open.slice(0, 30).forEach((t) => {
        doc.text(`- ${t.text} [${t.priority || "Medium"}]${t.dueDate ? ` (due ${t.dueDate})` : ""}`, 14, y);
        y += 6;
        if (y > 280) { doc.addPage(); y = 20; }
      });
      doc.save("scholarbox-study-summary.pdf");
      push("Study summary PDF exported.", "success");
    } catch { push("Export failed.", "error"); }
  };
  return (
    <div className="rounded-2xl border border-slate-200 dark:border-slate-800 p-4 bg-white dark:bg-slate-900">
      <div className="flex items-center gap-2 mb-3 text-slate-700 dark:text-slate-200 font-medium text-sm"><Download className="w-4 h-4" /> Export Study Summary</div>
      <p className="text-xs text-slate-400 mb-2">Generates a one-page PDF snapshot of your workspace: file count and open tasks by priority.</p>
      <button onClick={generate} className="w-full text-xs py-1.5 rounded-lg text-white" style={{ background: "var(--accent)" }}>Export Study Summary (PDF)</button>
    </div>
  );
}

/* ---- 13. Storage Analytics Trends Graph ---- */
function StorageAnalyticsTrend({ files }) {
  const active = files.filter((f) => !f.trashed);
  const byCat = useMemo(() => { const m = {}; active.forEach((f) => { const c = categoryOf(extOf(f.name)); m[c] = (m[c] || 0) + f.size; }); return m; }, [active]);
  const maxCat = Math.max(1, ...Object.values(byCat));
  const timeline = useMemo(() => {
    const sorted = [...active].sort((a, b) => (a.uploadedAt || 0) - (b.uploadedAt || 0));
    let cum = 0;
    return sorted.map((f) => { cum += f.size; return cum; });
  }, [active]);
  const maxCum = Math.max(1, ...timeline);
  const w = 260, h = 70;
  const points = timeline.map((c, i) => `${timeline.length > 1 ? (i / (timeline.length - 1)) * w : 0},${h - (c / maxCum) * h}`).join(" ");

  return (
    <div className="rounded-2xl border border-slate-200 dark:border-slate-800 p-4 bg-white dark:bg-slate-900">
      <div className="flex items-center gap-2 mb-3 text-slate-700 dark:text-slate-200 font-medium text-sm"><BarChart3 className="w-4 h-4" /> Storage Analytics Trends</div>
      <p className="text-[10px] text-slate-400 mb-1">Breakdown by file type</p>
      <div className="space-y-1 mb-3">
        {Object.entries(byCat).map(([cat, size]) => (
          <div key={cat} className="flex items-center gap-2 text-xs">
            <span className="w-12 text-slate-400">{cat}</span>
            <div className="flex-1 h-2 rounded-full bg-slate-100 dark:bg-slate-800 overflow-hidden">
              <div className="h-full rounded-full" style={{ width: `${(size / maxCat) * 100}%`, background: CATEGORY_COLORS[cat] }} />
            </div>
            <span className="text-slate-400 w-14 text-right">{formatBytes(size)}</span>
          </div>
        ))}
        {Object.keys(byCat).length === 0 && <p className="text-xs text-slate-400">No files yet.</p>}
      </div>
      <p className="text-[10px] text-slate-400 mb-1">Cumulative storage growth over time</p>
      {timeline.length > 1 ? (
        <svg viewBox={`0 0 ${w} ${h}`} className="w-full h-16">
          <polyline points={points} fill="none" stroke="var(--accent)" strokeWidth="2" />
        </svg>
      ) : (
        <p className="text-xs text-slate-400">Upload more files to see a growth trend.</p>
      )}
    </div>
  );
}

/* ---- 14. Custom Class Schedule Timetable Grid Planner ---- */
function TimetablePlanner({ push }) {
  const buildDefault = () => {
    const days = TIMETABLE_DAYS.map((d) => ({ id: uid(), name: d }));
    const rows = TIMETABLE_HOURS.map((h) => ({ id: uid(), time: `${h}:00` }));
    const legacy = loadLS(LS_KEYS.timetable, []);
    const cells = Array.isArray(legacy) ? legacy.map((b) => {
      const day = days.find((d) => d.name === b.day);
      const row = rows.find((r) => r.time === `${b.hour}:00`);
      if (!day || !row) return null;
      return { id: uid(), dayId: day.id, rowId: row.id, subject: b.subject, room: b.room };
    }).filter(Boolean) : [];
    return { days, rows, cells };
  };
  const [data, setData] = useState(() => (LIVE ? { days: TIMETABLE_DAYS.map((d) => ({ id: uid(), name: d })), rows: TIMETABLE_HOURS.map((h) => ({ id: uid(), time: `${h}:00` })), cells: [] } : (loadLS(LS_KEYS.timetableGrid, null) || buildDefault())));
  useEffect(() => { if (!LIVE) saveLS(LS_KEYS.timetableGrid, data); }, [data]);

  // Live mode: keep the whole timetable grid as one Firestore document so it
  // syncs to every device on the same Firebase project, same as tasks above.
  const lastWrittenTimetable = useRef(null);
  const timetableLoaded = useRef(false);
  useEffect(() => {
    if (!LIVE) return;
    const unsub = db.collection("app").doc("timetable").onSnapshot((doc) => {
      if (doc.exists && doc.data().grid) {
        lastWrittenTimetable.current = JSON.stringify(doc.data().grid);
        setData(doc.data().grid);
      }
      timetableLoaded.current = true;
    });
    return unsub;
  }, []);
  useEffect(() => {
    if (!LIVE || !timetableLoaded.current) return;
    const json = JSON.stringify(data);
    if (json === lastWrittenTimetable.current) return;
    lastWrittenTimetable.current = json;
    db.collection("app").doc("timetable").set({ grid: data, updatedAt: Date.now() }).catch((e) => console.error("Timetable sync failed:", e));
  }, [data]);
  const { days, rows, cells } = data;

  const [editingCell, setEditingCell] = useState(null); // { dayId, rowId }
  const [cellDraft, setCellDraft] = useState({ subject: "", room: "" });
  const [newDayName, setNewDayName] = useState("");
  const [newRowTime, setNewRowTime] = useState("");

  const at = (dayId, rowId) => cells.find((c) => c.dayId === dayId && c.rowId === rowId);

  const openCell = (dayId, rowId) => {
    const existing = at(dayId, rowId);
    setCellDraft({ subject: existing?.subject || "", room: existing?.room || "" });
    setEditingCell({ dayId, rowId });
  };
  const saveCell = () => {
    if (!editingCell) return;
    const { dayId, rowId } = editingCell;
    const existing = at(dayId, rowId);
    if (!cellDraft.subject.trim()) {
      if (existing) setData((d) => ({ ...d, cells: d.cells.filter((c) => c.id !== existing.id) }));
      setEditingCell(null);
      return;
    }
    if (existing) {
      setData((d) => ({ ...d, cells: d.cells.map((c) => (c.id === existing.id ? { ...c, subject: cellDraft.subject, room: cellDraft.room } : c)) }));
      push("Class updated.", "success");
    } else {
      setData((d) => ({ ...d, cells: [...d.cells, { id: uid(), dayId, rowId, subject: cellDraft.subject, room: cellDraft.room }] }));
      push("Class added to timetable.", "success");
    }
    setEditingCell(null);
  };
  const removeEditingCell = () => {
    if (!editingCell) return;
    const existing = at(editingCell.dayId, editingCell.rowId);
    if (existing) setData((d) => ({ ...d, cells: d.cells.filter((c) => c.id !== existing.id) }));
    setEditingCell(null);
  };

  const addDay = () => {
    if (!newDayName.trim()) return;
    setData((d) => ({ ...d, days: [...d.days, { id: uid(), name: newDayName.trim() }] }));
    setNewDayName("");
    push("Day column added.", "success");
  };
  const removeDay = (id) => {
    if (!window.confirm("Delete this whole day column and its classes?")) return;
    setData((d) => ({ ...d, days: d.days.filter((x) => x.id !== id), cells: d.cells.filter((c) => c.dayId !== id) }));
  };
  const renameDay = (id, name) => setData((d) => ({ ...d, days: d.days.map((x) => (x.id === id ? { ...x, name } : x)) }));

  const addRow = () => {
    if (!newRowTime.trim()) return;
    setData((d) => ({ ...d, rows: [...d.rows, { id: uid(), time: newRowTime.trim() }] }));
    setNewRowTime("");
    push("Time slot added.", "success");
  };
  const removeRow = (id) => {
    if (!window.confirm("Delete this whole time slot row and its classes?")) return;
    setData((d) => ({ ...d, rows: d.rows.filter((x) => x.id !== id), cells: d.cells.filter((c) => c.rowId !== id) }));
  };
  const renameRow = (id, time) => setData((d) => ({ ...d, rows: d.rows.map((x) => (x.id === id ? { ...x, time } : x)) }));
  const moveRow = (id, dir) => {
    setData((d) => {
      const idx = d.rows.findIndex((r) => r.id === id);
      const swap = idx + dir;
      if (swap < 0 || swap >= d.rows.length) return d;
      const rows = [...d.rows];
      [rows[idx], rows[swap]] = [rows[swap], rows[idx]];
      return { ...d, rows };
    });
  };

  return (
    <div className="rounded-2xl border border-slate-200 dark:border-slate-800 p-4 bg-white dark:bg-slate-900">
      <div className="flex items-center gap-2 mb-3 text-slate-700 dark:text-slate-200 font-medium text-sm"><Grid3x3 className="w-4 h-4" /> Weekly Timetable Planner</div>
      <p className="text-xs text-slate-400 mb-3">
        Click any cell to add or edit a class. Rename a day or time slot by editing it directly, use <X className="w-3 h-3 inline" /> to delete a whole column or row, and use the arrows to reorder time slots.
      </p>

      <div className="flex flex-wrap gap-1.5 mb-3">
        <input value={newDayName} onChange={(e) => setNewDayName(e.target.value)} onKeyDown={(e) => e.key === "Enter" && addDay()} placeholder="New day name…"
          className="text-xs rounded-lg border border-slate-200 dark:border-slate-700 bg-transparent px-2 py-1.5 outline-none w-32" />
        <button onClick={addDay} className="flex items-center gap-1 text-xs px-2.5 py-1.5 rounded-lg bg-slate-100 dark:bg-slate-800"><Plus className="w-3.5 h-3.5" /> Day</button>
        <input value={newRowTime} onChange={(e) => setNewRowTime(e.target.value)} onKeyDown={(e) => e.key === "Enter" && addRow()} placeholder="New time slot e.g. 20:00 or Period 8"
          className="text-xs rounded-lg border border-slate-200 dark:border-slate-700 bg-transparent px-2 py-1.5 outline-none w-40" />
        <button onClick={addRow} className="flex items-center gap-1 text-xs px-2.5 py-1.5 rounded-lg bg-slate-100 dark:bg-slate-800"><Plus className="w-3.5 h-3.5" /> Time Slot</button>
      </div>

      <div className="overflow-x-auto">
        <table className="text-[10px] border-collapse w-full">
          <thead>
            <tr>
              <th className="p-1"></th>
              {days.map((d) => (
                <th key={d.id} className="p-1 text-slate-400 font-medium">
                  <div className="flex items-center justify-center gap-1">
                    <input value={d.name} onChange={(e) => renameDay(d.id, e.target.value)}
                      className="w-14 text-center bg-transparent outline-none border-b border-transparent focus:border-indigo-400" />
                    <button onClick={() => removeDay(d.id)} title="Delete this day column" className="text-slate-300 hover:text-rose-500"><X className="w-3 h-3" /></button>
                  </div>
                </th>
              ))}
            </tr>
          </thead>
          <tbody>
            {rows.map((r, ri) => (
              <tr key={r.id}>
                <td className="p-1 text-slate-400 whitespace-nowrap">
                  <div className="flex items-center gap-0.5">
                    <div className="flex flex-col -mr-0.5">
                      <button onClick={() => moveRow(r.id, -1)} disabled={ri === 0} className="disabled:opacity-20 hover:text-indigo-500"><ChevronDown className="w-2.5 h-2.5 rotate-180" /></button>
                      <button onClick={() => moveRow(r.id, 1)} disabled={ri === rows.length - 1} className="disabled:opacity-20 hover:text-indigo-500"><ChevronDown className="w-2.5 h-2.5" /></button>
                    </div>
                    <input value={r.time} onChange={(e) => renameRow(r.id, e.target.value)}
                      className="w-14 bg-transparent outline-none border-b border-transparent focus:border-indigo-400" />
                    <button onClick={() => removeRow(r.id)} title="Delete this time slot row" className="text-slate-300 hover:text-rose-500"><X className="w-3 h-3" /></button>
                  </div>
                </td>
                {days.map((d) => {
                  const b = at(d.id, r.id);
                  const isEditing = editingCell && editingCell.dayId === d.id && editingCell.rowId === r.id;
                  if (isEditing) {
                    return (
                      <td key={d.id} className="p-0.5 relative">
                        <div className="absolute z-20 top-0 left-0 w-40 rounded-xl border border-indigo-300 dark:border-indigo-700 bg-white dark:bg-slate-900 shadow-xl p-2 space-y-1.5">
                          <div className="text-[9px] text-slate-400 font-medium">{d.name} · {r.time}</div>
                          <input autoFocus value={cellDraft.subject} onChange={(e) => setCellDraft({ ...cellDraft, subject: e.target.value })}
                            onKeyDown={(e) => { if (e.key === "Enter") saveCell(); if (e.key === "Escape") setEditingCell(null); }}
                            placeholder="Subject" className="w-full text-[10px] rounded-md border border-slate-200 dark:border-slate-700 bg-transparent px-1.5 py-1 outline-none" />
                          <input value={cellDraft.room} onChange={(e) => setCellDraft({ ...cellDraft, room: e.target.value })}
                            onKeyDown={(e) => { if (e.key === "Enter") saveCell(); if (e.key === "Escape") setEditingCell(null); }}
                            placeholder="Room" className="w-full text-[10px] rounded-md border border-slate-200 dark:border-slate-700 bg-transparent px-1.5 py-1 outline-none" />
                          <div className="flex gap-1">
                            <button onClick={saveCell} className="flex-1 text-[10px] py-1 rounded-md text-white" style={{ background: "var(--accent)" }}>Save</button>
                            {b && <button onClick={removeEditingCell} className="px-2 text-[10px] py-1 rounded-md bg-rose-50 dark:bg-rose-950/40 text-rose-500">Del</button>}
                            <button onClick={() => setEditingCell(null)} className="px-2 text-[10px] py-1 rounded-md bg-slate-100 dark:bg-slate-800">Esc</button>
                          </div>
                        </div>
                        <div className="w-full h-5 rounded-md bg-indigo-50 dark:bg-indigo-950/40 ring-2 ring-indigo-300" />
                      </td>
                    );
                  }
                  return (
                    <td key={d.id} className="p-0.5">
                      {b ? (
                        <button onClick={() => openCell(d.id, r.id)} className="w-full rounded-md px-1 py-1 text-white truncate hover:opacity-90" style={{ background: "var(--accent)" }} title="Click to edit this class">
                          {b.subject}{b.room ? ` · ${b.room}` : ""}
                        </button>
                      ) : (
                        <button onClick={() => openCell(d.id, r.id)} className="w-full h-5 rounded-md bg-slate-50 dark:bg-slate-800/40 hover:bg-indigo-50 dark:hover:bg-indigo-950/30 hover:ring-1 hover:ring-indigo-300 transition" title="Click to add a class here" />
                      )}
                    </td>
                  );
                })}
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}
